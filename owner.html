<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Media Equipment Rental · Panel Owner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
      --bg: #F4F6FB;
      --surface: #FFFFFF;
      --surface-2: #EDF1F9;
      --ink: #0D1730;
      --ink-2: #4F5B76;
      --ink-3: #8790A6;
      --line: #DCE2EE;
      --navy: #14275F;
      --navy-hover: #0E1D4A;
      --navy-ink: #FFFFFF;
      --navy-soft: #E5EBFA;
      --link: #1E3A94;
      --hero: #0D1A44;
      --hero-2: #16285F;
      --hero-3: #21367A;
      --hero-ink: #F3F5FB;
      --hero-mute: #A7B4D8;
      --accent: #F7931E;
      --accent-hover: #E8820B;
      --accent-ink: #1C1205;
      --accent-soft: #FFF0DC;
      --accent-text: #B35F00;
      --ok: #157A46;
      --ok-soft: #E1F4E8;
      --warn: #A85A06;
      --warn-soft: #FFF1DC;
      --bad: #BF3320;
      --bad-soft: #FDE7E3;
      --t-cam: #E2E9FB;
      --t-lens: #E8E5FA;
      --t-sup: #E3ECF1;
      --t-aud: #FCEADB;
      --t-lig: #FBF2D3;
      --art-ink: #1B2B5E;
      --qr-ink: #0D1730;
      --qr-bg: #FFFFFF;
      --shadow: 0 1px 2px rgba(13, 23, 48, .05), 0 6px 20px rgba(13, 23, 48, .06);
      --shadow-lg: 0 24px 60px rgba(13, 23, 48, .16);
      --f-display: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --f-body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
      --r-sm: 10px;
      --r: 14px;
      --r-lg: 20px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #090F22;
        --surface: #111A33;
        --surface-2: #18233F;
        --ink: #E8ECF6;
        --ink-2: #A6B0C7;
        --ink-3: #6E7995;
        --line: #24304E;
        --navy: #2C4AA4;
        --navy-hover: #3657BA;
        --navy-ink: #FFFFFF;
        --navy-soft: #1A2851;
        --link: #9DB4FF;
        --hero: #0B1535;
        --hero-2: #14224D;
        --hero-3: #1E3168;
        --hero-ink: #F3F5FB;
        --hero-mute: #9FADD3;
        --accent: #FF9F33;
        --accent-hover: #FFB45E;
        --accent-ink: #1C1205;
        --accent-soft: #3A2810;
        --accent-text: #FFB45E;
        --ok: #4CC584;
        --ok-soft: #11301F;
        --warn: #F2A54A;
        --warn-soft: #3A2810;
        --bad: #FF7E69;
        --bad-soft: #3D1A15;
        --t-cam: #19254E;
        --t-lens: #211E49;
        --t-sup: #182636;
        --t-aud: #382416;
        --t-lig: #353016;
        --art-ink: #C9D5FF;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
        --shadow-lg: 0 24px 60px rgba(0, 0, 0, .5);
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #090F22;
      --surface: #111A33;
      --surface-2: #18233F;
      --ink: #E8ECF6;
      --ink-2: #A6B0C7;
      --ink-3: #6E7995;
      --line: #24304E;
      --navy: #2C4AA4;
      --navy-hover: #3657BA;
      --navy-ink: #FFFFFF;
      --navy-soft: #1A2851;
      --link: #9DB4FF;
      --hero: #0B1535;
      --hero-2: #14224D;
      --hero-3: #1E3168;
      --hero-ink: #F3F5FB;
      --hero-mute: #9FADD3;
      --accent: #FF9F33;
      --accent-hover: #FFB45E;
      --accent-ink: #1C1205;
      --accent-soft: #3A2810;
      --accent-text: #FFB45E;
      --ok: #4CC584;
      --ok-soft: #11301F;
      --warn: #F2A54A;
      --warn-soft: #3A2810;
      --bad: #FF7E69;
      --bad-soft: #3D1A15;
      --t-cam: #19254E;
      --t-lens: #211E49;
      --t-sup: #182636;
      --t-aud: #382416;
      --t-lig: #353016;
      --art-ink: #C9D5FF;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, .5);
      color-scheme: dark;
    }
  *, *::before, *::after { box-sizing: border-box }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased }
  h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; letter-spacing: -.02em; line-height: 1.2; text-wrap: balance }
  p { margin: 0 }
  button { font: inherit; color: inherit }
  a { color: var(--link) }
  img { max-width: 100% }
  [hidden] { display: none !important }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px }
  .muted { color: var(--ink-2) }
  .small { font-size: 13px }
  .mono { font-family: var(--f-mono); letter-spacing: .02em }
  .num { font-variant-numeric: tabular-nums }
  .ic { width: 20px; height: 20px; flex: none }
  .ic.sm { width: 16px; height: 16px }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 700 14px/1.1 var(--f-body); padding: 11px 16px; border-radius: 11px; border: 1.5px solid transparent; cursor: pointer; white-space: nowrap; text-decoration: none }
  .btn:disabled { opacity: .45; cursor: not-allowed }
  .btn-accent { background: var(--accent); color: var(--accent-ink) }
  .btn-accent:hover:not(:disabled) { background: var(--accent-hover) }
  .btn-navy { background: var(--navy); color: var(--navy-ink) }
  .btn-navy:hover:not(:disabled) { background: var(--navy-hover) }
  .btn-outline { background: var(--surface); border-color: var(--line); color: var(--ink) }
  .btn-outline:hover:not(:disabled) { border-color: var(--link); color: var(--link) }
  .btn-danger { background: var(--surface); border-color: var(--bad); color: var(--bad) }
  .btn-sm { padding: 8px 12px; font-size: 13px; border-radius: 9px }
  .btn-block { width: 100% }
  .link { background: none; border: 0; padding: 0; color: var(--link); font-weight: 700; cursor: pointer }
  .link:hover { text-decoration: underline }

  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font: 700 12px/1.4 var(--f-body); background: var(--surface-2); color: var(--ink-2); white-space: nowrap }
  .pill .ic { width: 13px; height: 13px }
  .pill-ok { background: var(--ok-soft); color: var(--ok) }
  .pill-warn { background: var(--warn-soft); color: var(--warn) }
  .pill-bad { background: var(--bad-soft); color: var(--bad) }
  .pill-navy { background: var(--navy-soft); color: var(--link) }
  .pill-accent { background: var(--accent-soft); color: var(--accent-text) }

  .inp { width: 100%; min-width: 0; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 11px; background: var(--surface); color: var(--ink); font: 500 14.5px/1.3 var(--f-body) }
  .inp:focus { outline: none; border-color: var(--link); box-shadow: 0 0 0 4px var(--navy-soft) }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0 }
  .field > span { font-size: 13px; font-weight: 700; color: var(--ink-2) }

  /* App shell: fixed navy rail, content column; rail becomes a scrolling top bar on narrow screens */
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh }
  .rail { min-width: 0; background: var(--hero); color: var(--hero-ink); padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh }
  .brand { display: flex; gap: 10px; align-items: center; padding: 0 6px }
  .brand-mark { width: 36px; height: 36px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none }
  .brand b { display: block; font: 800 14.5px/1.1 var(--f-display) }
  .brand small { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--hero-mute) }
  .rail nav { display: flex; flex-direction: column; gap: 3px; flex: 1 }
  .rail nav button { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border: 0; background: none; color: var(--hero-mute); border-radius: 10px; cursor: pointer; font-weight: 600; text-align: left; white-space: nowrap }
  .rail nav button:hover { color: var(--hero-ink); background: rgba(255, 255, 255, .06) }
  .rail nav button.on { background: var(--hero-3); color: var(--hero-ink); font-weight: 800 }
  .rail nav em { margin-left: auto; font-style: normal; background: var(--accent); color: var(--accent-ink); font-size: 11.5px; font-weight: 800; border-radius: 99px; min-width: 20px; padding: 0 6px; text-align: center }
  .rail-foot { border-top: 1px solid rgba(255, 255, 255, .12); padding: 14px 6px 0; font-size: 13px; color: var(--hero-mute); display: flex; flex-direction: column; gap: 8px }
  .rail-foot b { color: var(--hero-ink); display: block }
  .rail-foot button, .rail-foot a { background: none; border: 0; padding: 0; color: var(--hero-mute); cursor: pointer; font-weight: 600; font-size: 13px; text-decoration: none; display: flex; align-items: center; gap: 8px; text-align: left }
  .rail-foot button:hover, .rail-foot a:hover { color: var(--hero-ink) }

  .main { padding-block: 28px 56px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); min-width: 0; max-width: 1280px; width: 100% }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 22px }
  .head h1 { font-size: clamp(24px, 3vw, 30px); font-weight: 800 }
  .head p { color: var(--ink-2); margin-top: 4px }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px }
  .pad { padding: 20px }
  .card h3 { font-size: 16px; font-weight: 800 }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 12px }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
  .stack { display: flex; flex-direction: column; gap: 16px; min-width: 0 }
  .g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px }
  .detail { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start }

  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 16px }
  .tile { padding: 16px 18px; text-align: left; cursor: pointer; display: block; width: 100% }
  .tile:hover { border-color: var(--link) }
  .tile span { display: block; font-size: 13px; color: var(--ink-2); font-weight: 600 }
  .tile b { display: block; font: 800 28px/1.2 var(--f-display); letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums }
  .tile small { color: var(--ink-3); font-size: 12.5px }
  .tile.alert b { color: var(--bad) }

  .banner { display: flex; gap: 12px; align-items: center; padding: 13px 16px; border-radius: 14px; margin-bottom: 16px; flex-wrap: wrap }
  .banner > div { flex: 1; min-width: 200px }
  .banner b { display: block }
  .banner.bad { background: var(--bad-soft); color: var(--bad) }
  .banner.warn { background: var(--warn-soft); color: var(--warn) }
  .banner.ok { background: var(--ok-soft); color: var(--ok) }
  .banner p { color: var(--ink-2); font-size: 13.5px }

  .agenda { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line) }
  .agenda .tm { font: 700 14px var(--f-mono); width: 50px; flex: none }
  .agenda > div { flex: 1; min-width: 0 }
  .agenda b { display: block; font-size: 14.5px }
  .agenda small { color: var(--ink-2); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .none { color: var(--ink-3); padding: 18px 0 6px; text-align: center; font-size: 14px }

  .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px }
  .search { flex: 1; min-width: 200px; max-width: 360px; display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 11px; background: var(--surface); padding: 0 12px }
  .search:focus-within { border-color: var(--link) }
  .search .ic { color: var(--ink-3) }
  .search input { flex: 1; min-width: 0; border: 0; background: none; padding: 10px 0; font: 500 14.5px var(--f-body); color: var(--ink) }
  .search input:focus { outline: none }
  .chips { display: flex; gap: 6px; flex-wrap: wrap }
  .chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--ink-2) }
  .chip:hover { border-color: var(--link) }
  .chip.on { background: var(--navy); border-color: var(--navy); color: var(--navy-ink) }
  .chip em { font-style: normal; opacity: .7; margin-left: 3px }

  .tbl-wrap { overflow-x: auto }
  table { width: 100%; border-collapse: collapse; font-size: 14px }
  th { text-align: left; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap }
  td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle }
  tbody tr:last-child td { border-bottom: 0 }
  tr.click { cursor: pointer }
  tr.click:hover td { background: var(--surface-2) }
  td.r, th.r { text-align: right }
  td small { display: block; color: var(--ink-3) }

  .art { background: var(--tint); color: var(--art-ink); width: 46px; height: 38px; border-radius: 9px; display: grid; place-items: center; flex: none }
  .art svg { width: 82%; fill: none; stroke: currentColor; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round }
  .art .a { stroke: var(--accent) }

  /* Handover station */
  .station { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start }
  .seg { display: inline-grid; grid-auto-flow: column; background: var(--surface-2); padding: 4px; border-radius: 12px; gap: 2px }
  .seg button { border: 0; background: none; padding: 8px 14px; border-radius: 9px; font-weight: 700; font-size: 13.5px; cursor: pointer; color: var(--ink-2); display: flex; gap: 7px; align-items: center; white-space: nowrap }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow) }
  .q { display: block; width: 100%; text-align: left; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer }
  .q:hover { border-color: var(--link) }
  .q.on { border-color: var(--accent); background: var(--accent-soft) }
  .q b { font-family: var(--f-mono); font-size: 13.5px }
  .q small { display: block; color: var(--ink-2); font-size: 12.5px }
  .reader-top { display: flex; gap: 16px; align-items: center; padding: 18px 20px; background: var(--hero); color: var(--hero-ink); border-radius: 16px 16px 0 0; flex-wrap: wrap }
  .reader-top > div { flex: 1; min-width: 180px }
  .reader-top small { color: var(--hero-mute); display: block; font: 700 12px var(--f-mono); letter-spacing: .04em }
  .reader-top b { font: 800 19px var(--f-display) }
  .ring { width: 56px; height: 56px; border-radius: 50%; background: rgba(255, 255, 255, .08); color: var(--accent); display: grid; place-items: center; position: relative; flex: none }
  .ring.live::before, .ring.live::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); animation: pulse 1.6s ease-out infinite }
  .ring.live::after { animation-delay: .8s }
  @keyframes pulse { from { transform: scale(1); opacity: .8 } to { transform: scale(1.6); opacity: 0 } }
  .tagrow { display: flex; gap: 12px; align-items: center; padding: 11px 20px; border-top: 1px solid var(--line) }
  .tagrow > div:not(.art) { flex: 1; min-width: 0 }
  .tagrow b { display: block; font-size: 14.5px }
  .tagrow small { font: 500 12px var(--f-mono); color: var(--ink-3) }
  .tagrow.found { background: var(--ok-soft) }
  .tagrow.miss { background: var(--bad-soft) }
  .tagrow.alien { background: var(--warn-soft) }
  .reader-foot { padding: 16px 20px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px }

  .kv { display: grid; grid-template-columns: auto 1fr; row-gap: 7px; margin: 0; font-size: 14px }
  .kv dt { color: var(--ink-2) }
  .kv dd { margin: 0; padding-left: 16px; font-weight: 700; text-align: right; min-width: 0; overflow-wrap: anywhere }
  .kv .tot { border-top: 1px solid var(--line); padding-top: 9px; font-size: 16px; font-weight: 800; color: var(--ink) }

  .tl { list-style: none; margin: 0; padding: 0 }
  .tl li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 14px }
  .tl li:last-child { padding-bottom: 0 }
  .tl li::before { content: ""; position: absolute; left: 11px; top: 24px; bottom: 0; width: 2px; background: var(--line) }
  .tl li:last-child::before { display: none }
  .tl li.done::before { background: var(--ok) }
  .tl i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-3); z-index: 1 }
  .tl i .ic { width: 13px; height: 13px; stroke-width: 3 }
  .tl li.done i { background: var(--ok); color: var(--surface) }
  .tl li.cur i { background: var(--accent); color: var(--accent-ink) }
  .tl li.todo b { color: var(--ink-3); font-weight: 600 }
  .tl small { display: block; color: var(--ink-3); font-size: 12.5px }

  .idcard { background: linear-gradient(135deg, var(--navy-soft), var(--surface-2)); border-radius: 12px; padding: 12px; display: flex; gap: 12px; align-items: center; width: 100%; max-width: 280px }
  .idcard .ph { width: 48px; height: 60px; border-radius: 7px; background: var(--surface); display: grid; place-items: center; color: var(--ink-3); flex: none }
  .idcard b { display: block; font-size: 13px }
  .idcard small { font-size: 11.5px; color: var(--ink-2); display: block }
  .vq { display: grid; grid-template-columns: 280px minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 16px 20px; border-top: 1px solid var(--line) }

  /* Revenue chart: single series, one hue, recessive grid */
  .plot { position: relative; height: 230px; margin: 16px 0 4px 58px }
  .gl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line) }
  .gl span { position: absolute; right: 100%; margin-right: 8px; top: -9px; font-size: 12px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums }
  .bars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 2px }
  .bc { flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end; background: none; border: 0; padding: 0; cursor: default; border-radius: 4px }
  .bc i { display: block; width: 100%; max-width: 40px; margin: 0 auto; background: var(--link); border-radius: 4px 4px 0 0 }
  .bc:hover i, .bc:focus i { background: var(--accent) }
  .xl { display: flex; gap: 2px; margin-left: 58px; font-size: 12px; color: var(--ink-3) }
  .xl span { flex: 1; min-width: 0; text-align: center; white-space: nowrap; overflow: visible }
  .hb { display: grid; grid-template-columns: minmax(120px, 210px) minmax(0, 1fr) 96px; gap: 12px; align-items: center; padding: 7px 0; font-size: 14px }
  .hb > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600 }
  .hb u { display: block; height: 14px; background: var(--link); border-radius: 0 4px 4px 0 }
  .hb b { text-align: right; font-variant-numeric: tabular-nums }
  #tip { position: fixed; z-index: 90; background: var(--ink); color: var(--bg); padding: 7px 10px; border-radius: 9px; font-size: 13px; pointer-events: none; box-shadow: var(--shadow-lg); white-space: nowrap }
  details.tv { margin-top: 12px; font-size: 14px }
  details.tv summary { cursor: pointer; color: var(--link); font-weight: 700 }

  .login { min-height: 100vh; display: grid; place-items: center; background: var(--hero); padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .login .card { width: 100%; max-width: 410px; padding: 30px; display: flex; flex-direction: column; gap: 14px }
  .toasts { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 100; width: min(440px, calc(100vw - 32px)) }
  .toast { background: var(--ink); color: var(--bg); padding: 12px 15px; border-radius: 12px; font-weight: 600; font-size: 14px; display: flex; gap: 10px; align-items: center; box-shadow: var(--shadow-lg) }
  .toast .ic { color: var(--accent) }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important } }

function calc(lines, days) {
  let rent = 0, pkg = 0, deposit = 0, daily = 0;
  lines.forEach(l => { const it = item(l.id), r = it.price * l.qty * days; rent += r; daily += it.price * l.qty; if (l.pkg) pkg += r; deposit += it.deposit * l.qty; });
  const discount = Math.round(pkg * .1), fee = lines.length ? 5000 : 0;

}
function rfidEntry(o, type, at) {

}
function mk(code, cust, lines, startOff, endOff, time, status, method = 'QRIS') {
  const ls = lines.map(([id, qty = 1]) => ({ id, qty }));
  const start = iso(addDays(TODAY, startOff)), end = iso(addDays(TODAY, endOff));
  const hh = parseInt(time, 10);
  const pickupAt = parseIso(start).getTime() + hh * HOUR, dueAt = parseIso(end).getTime() + hh * HOUR;
  const days = endOff - startOff;
  const o = Object.assign({ code, cust, lines: ls, start, end, time, days, pickupAt, dueAt, status, method: status === 'pending' ? null : method, events: {}, rfid: [], review: null, lateFee: 0, damageFee: 0 }, calc(ls, days));
  const idx = STEPS.findIndex(s => s[0] === status);
  const placed = Math.min(pickupAt, Date.now()) - 26 * HOUR;
  o.events.pending = placed;
  if (idx >= 1) o.events.confirmed = placed + 4 * MIN;
  if (idx >= 2) o.events.ready = Math.min(pickupAt - 2 * HOUR, Date.now() - 30 * MIN);
  if (idx >= 4) { o.events.pickedup = o.events.inuse = pickupAt + 6 * MIN; o.rfid.push(rfidEntry(o, 'out', pickupAt + 6 * MIN)); }
  if (idx >= 5) { const at = Math.min(dueAt - 25 * MIN, Date.now() - 50 * MIN); o.events.returned = at; o.rfid.push(rfidEntry(o, 'in', at)); }
  if (idx >= 6) o.events.completed = o.events.returned + 40 * MIN;
  return o;
}

      ${done && h.alien ? `<div class="banner warn" style="margin:0">${ic('alert')}<div><b>Ada alat dari pesanan lain</b><p>Keluarkan dari gerbang, lalu pindai ulang.</p></div></div>` : ''}

const renderReader = () => { const el = $('#reader'); if (el) el.innerHTML = readerHTML(); };
function checkPanel(o) {

}
function checkForm(o) {

  return `<h3>Cek kondisi alat</h3>

    ${d.cond === 'rusak' ? `<label class="field" style="max-width:260px"><span>Biaya perbaikan (Rp)</span><input class="inp num" id="dmg-amt" type="number" min="0" step="10000" value="${d.amount}" data-in="dmg"></label>` : ''}
    <dl class="kv" id="refund-kv">${refundKV(o, late, dmg, refund)}</dl>
    <button class="btn btn-accent" data-act="complete" data-code="${o.code}">${ic('wallet', 'sm')} Selesaikan & kembalikan deposit</button>`;
}
function refundKV(o, late, dmg, refund) {
  return `<dt>Deposit</dt><dd class="num">${rp(o.deposit)}</dd>
    ${late ? `<dt>Denda keterlambatan</dt><dd class="num">−${rp(late)}</dd>` : ''}

let scanRun = 0;
function startScan() {
  const h = S.h, o = getOrder(h.code), tags = expectedTags(o), run = ++scanRun;
  const skip = h.scenario === 'miss' && tags.length ? tags[tags.length - 1].tag : null;
  const alien = h.scenario === 'alien' ? ITEMS.find(i => !o.lines.some(l => l.id === i.id)).id : null;
  h.phase = 'scanning'; h.found = []; h.alien = null;
  renderReader();
  const read = tags.filter(t => t.tag !== skip);
  read.forEach((t, i) => setTimeout(() => { if (run !== scanRun) return; h.found.push(t.tag); renderReader(); }, 450 + i * 420));
  setTimeout(() => {
    if (run !== scanRun) return;
    h.phase = 'done'; h.alien = alien;
    h.scenario = 'normal'; /* a rescan always succeeds, like clearing the gate */
    renderReader();
  }, 650 + read.length * 420);
}
function confirmHandover() {
  const h = S.h, o = getOrder(h.code);
  if (!o) return;
  const now = Date.now(), e = rfidEntry(o, h.mode, now);
  o.rfid = o.rfid || [];
  o.rfid.push(e);
  if (h.mode === 'out') {
    o.status = 'inuse'; o.events.pickedup = now; o.events.inuse = now;
    commit(o, ['rfid', 'Alat sudah diambil', `${e.tags.length} alat tercatat diambil untuk ${o.code}, pukul ${fTime(now)}.`]);
    toast(`${o.code} diserahkan. Stok ${e.tags.length} unit jadi Disewa.`, 'radio');
    h.code = null; h.phase = 'idle'; h.found = [];
    render();
  } else {
    o.status = 'returned'; o.events.returned = now; o.lateFee = lateInfo(o, now).fee;
    commit(o, ['rfid', 'Pengembalian tercatat', `${e.tags.length} alat ${o.code} tercatat kembali, pukul ${fTime(now)}.${o.lateFee ? ' Denda ' + rp(o.lateFee) + '.' : ''}`]);
    S.dmg = { cond: 'baik', amount: 0 }; h.phase = 'check';
    render();
  }
}

/* ---------- Inventory ---------- */
function unitsOf(it) {
  const all = allOrders();
  const held = all.filter(o => o.status === 'inuse').reduce((a, o) => a + o.lines.filter(l => l.id === it.id).reduce((x, l) => x + l.qty, 0), 0);
  const prep = all.filter(o => o.status === 'ready').reduce((a, o) => a + o.lines.filter(l => l.id === it.id).reduce((x, l) => x + l.qty, 0), 0);
  let h = held, p = prep;
  return Array.from({ length: it.stock }, (_, i) => {
    const tag = tagId(it.id, i);
    let status = 'Tersedia';
    if (S.service[tag]) status = 'Servis';
    else if (h > 0) { status = 'Disewa'; h--; }
    else if (p > 0) { status = 'Disiapkan'; p--; }
    const seen = logEntries().find(e => e.tags.some(t => t.tag === tag));
    return { tag, status, seen };
  });
}

    <div class="tools"><label class="search">${ic('search')}<input id="i-q" type="search" placeholder="Cari alat" value="${esc(S.invQ)}" data-in="iq" aria-label="Cari alat"></label>

/* ---------- Reports ---------- */
function niceMax(v) { if (v <= 0) return 100000; const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return [1, 1.5, 2, 2.5, 3, 4, 5, 7.5, 10].find(x => m <= x) * p; }
PAGES.reports = () => {
  const n = S.range;
  const days = Array.from({ length: n }, (_, i) => addDays(TODAY, i - n + 1));
  const from = days[0].getTime();
  const os = allOrders().filter(o => o.status !== 'pending' && o.pickupAt >= from && o.pickupAt <= Date.now());
  const perDay = days.map(d => os.filter(o => sameDay(o.pickupAt, d)).reduce((a, o) => a + income(o), 0));
  const total = perDay.reduce((a, b) => a + b, 0);
  const fees = os.reduce((a, o) => a + (o.lateFee || 0) + (o.damageFee || 0), 0);
  const max = niceMax(Math.max(...perDay));
  const step = n > 14 ? 5 : 1;
  const byItem = ITEMS.map(it => ({ it, rev: os.reduce((a, o) => a + o.lines.filter(l => l.id === it.id).reduce((x, l) => x + it.price * l.qty * o.days, 0), 0), days: os.reduce((a, o) => a + o.lines.filter(l => l.id === it.id).reduce((x, l) => x + l.qty * o.days, 0), 0) })).sort((a, b) => b.rev - a.rev);
  const top = byItem.slice(0, 6), topMax = top[0] && top[0].rev || 1;
  const unitDays = ITEMS.reduce((a, i) => a + i.stock, 0) * n;
  const util = Math.round(byItem.reduce((a, x) => a + x.days, 0) / unitDays * 100);
  const tile = (l, v, s) => `<div class="card tile" style="cursor:default"><span>${l}</span><b>${v}</b><small>${s}</small></div>`;
  return `<div class="head"><div><h1>Laporan</h1><p>Berdasarkan tanggal pengambilan, di luar deposit.</p></div>
      <div class="seg">${[7, 30].map(r => `<button class="${n === r ? 'on' : ''}" data-act="range" data-v="${r}">${r} hari</button>`).join('')}</div></div>
    <div class="tiles">${tile('Pendapatan', rpShort(total), n + ' hari terakhir')}${tile('Pesanan', os.length, 'rata-rata ' + rpShort(os.length ? total / os.length : 0))}${tile('Utilisasi unit', util + '%', 'hari-unit tersewa')}${tile('Denda & perbaikan', rpShort(fees), 'termasuk di pendapatan')}</div>
    <section class="card pad" style="margin-bottom:16px"><h3>Pendapatan per hari</h3>
      <div class="plot" role="img" aria-label="Grafik pendapatan per hari, ${n} hari terakhir, total ${rp(total)}">
        ${[1, .5, 0].map(f => `<div class="gl" style="top:${(1 - f) * 100}%"><span>${f ? rpShort(max * f) : 'Rp0'}</span></div>`).join('')}
        <div class="bars">${perDay.map((v, i) => `<button class="bc" data-tip="${fShort(days[i])}: ${rp(v)}" aria-label="${fShort(days[i])}: ${rp(v)}">${v ? `<i style="height:${v / max * 100}%"></i>` : ''}</button>`).join('')}</div>
      </div>
      <div class="xl">${days.map((d, i) => `<span>${(n - 1 - i) % step === 0 ? fShort(d) : ''}</span>`).join('')}</div>
      <details class="tv"><summary>Lihat sebagai tabel</summary><div class="tbl-wrap" style="max-height:260px;overflow:auto"><table><thead><tr><th>Tanggal</th><th class="r">Pendapatan</th></tr></thead><tbody>${days.map((d, i) => `<tr><td>${fShort(d)}</td><td class="r num">${rp(perDay[i])}</td></tr>`).join('')}</tbody></table></div></details>
    </section>
    <section class="card pad"><h3 style="margin-bottom:10px">Alat dengan pendapatan tertinggi</h3>
      ${top.filter(x => x.rev).map(x => `<div class="hb" data-tip="${esc(x.it.name)}: ${x.days} hari-unit"><span>${esc(x.it.name)}</span><div><u style="width:${x.rev / topMax * 100}%"></u></div><b>${rpShort(x.rev)}</b></div>`).join('') || '<p class="none">Belum ada data di rentang ini.</p>'}
    </section>`;
};

/* ---------- Actions ---------- */
const A = {
  logout: () => { S.staff = null; save(); render(); },
  resetDemo: () => { try { localStorage.removeItem(OWNER_KEY); localStorage.removeItem(RENTER_KEY); } catch (e) {} location.reload(); },
  openHandover: d => { S.hTab = 'scan'; S.h = { mode: d.mode, code: d.code, phase: 'idle', found: [], scenario: 'normal', alien: null }; go('handover'); },
  hTab: d => { S.hTab = d.v; render(); },
  hMode: d => { scanRun++; S.h = { mode: d.v, code: null, phase: 'idle', found: [], scenario: 'normal', alien: null }; render(); },
  hPick: d => { scanRun++; Object.assign(S.h, { code: d.code, phase: 'idle', found: [], alien: null, scenario: 'normal' }); render(); },
  hScan: () => startScan(),
  hConfirm: () => confirmHandover(),
  cond: d => { S.dmg.cond = d.v; if (S.page === 'order') render(); else renderReader(); },
  complete: d => {
    const o = getOrder(d.code), dmg = S.dmg.cond === 'rusak' ? Math.max(0, S.dmg.amount || 0) : 0;
    o.damageFee = dmg; o.status = 'completed'; o.events.completed = Date.now();
    const refund = Math.max(0, o.deposit - (o.lateFee || 0) - dmg);
    commit(o, ['deposit', 'Deposit dikembalikan', `Deposit ${rp(refund)} untuk ${o.code} sudah dikembalikan.`]);
    S.dmg = { cond: 'baik', amount: 0 };
    Object.assign(S.h, { code: null, phase: 'idle', found: [] });
    toast(`Deposit ${rp(refund)} dikembalikan.`, 'wallet');
    render();
  },
  markPaid: d => { const o = getOrder(d.code); o.status = 'confirmed'; o.method = 'Transfer manual'; o.events.confirmed = Date.now(); commit(o, ['pay', 'Pembayaran diterima', `${o.code} dikonfirmasi oleh toko.`]); render(); toast('Pembayaran dikonfirmasi.'); },
  markReady: d => { const o = getOrder(d.code); o.status = 'ready'; o.events.ready = Date.now(); commit(o, ['pickup', 'Alat siap diambil', `${o.code} sudah dicek dan siap. Jadwal ambil ${fDT(o.pickupAt)}.`]); render(); toast(`${o.code} siap diambil.`, 'package'); },
  remind: d => { const o = getOrder(d.code); commit(o, ['return', 'Pengembalian terlambat', `${o.code} sudah lewat batas. Segera kembalikan ke toko.`]); toast('Pengingat dikirim ke pelanggan.', 'bell'); },
  oFilter: d => { S.ordersFilter = d.v; render(); },
  iCat: d => { S.invCat = d.v; render(); },
  iOpen: d => { S.invOpen = S.invOpen === d.id ? null : d.id; render(); },
  service: d => { if (S.service[d.tag]) delete S.service[d.tag]; else S.service[d.tag] = true; save(); render(); toast(S.service[d.tag] ? 'Unit dikirim ke servis, tidak bisa disewa.' : 'Unit tersedia lagi.', 'package'); },
  cTab: d => { S.custTab = d.v; render(); },
  verify: d => { S.verify[d.id] = d.v; save(); render(); toast(d.v === 'verified' ? 'Identitas disetujui.' : 'Identitas ditolak.', d.v === 'verified' ? 'shield' : 'x'); },
  range: d => { S.range = +d.v; render(); },
};
const CH = { hScenario: t => { S.h.scenario = t.value; } };
const IN = {
  oq: t => { S.q = t.value; const all = allOrders(), f = S.ordersFilter; const preds = { all: () => true, pending: o => o.status === 'pending', prep: o => ['confirmed', 'ready'].includes(o.status), inuse: o => o.status === 'inuse', late: isLate, returned: o => o.status === 'returned', completed: o => o.status === 'completed' }; const q = t.value.trim().toLowerCase(); $('#o-table').innerHTML = ordersTable(all.filter(preds[f]).filter(o => !q || (o.code + ' ' + custOf(o).name).toLowerCase().includes(q)).sort((a, b) => b.pickupAt - a.pickupAt)); },
  iq: t => { S.invQ = t.value; const q = t.value.trim().toLowerCase(); $('#i-body').innerHTML = invRows(ITEMS.filter(i => (S.invCat === 'all' || i.cat === S.invCat) && (!q || (i.name + ' ' + i.brand).toLowerCase().includes(q)))); },
  dmg: t => { S.dmg.amount = Math.max(0, +t.value || 0); const o = getOrder(S.page === 'order' ? S.code : S.h.code), late = o.lateFee || 0, dmg = S.dmg.amount; $('#refund-kv').innerHTML = refundKV(o, late, dmg, Math.max(0, o.deposit - late - dmg)); },
};
const FORMS = {
  login: () => { S.staff = 'Owner Toko'; save(); go('dash'); },
  hCode: f => {
    const v = $('#h-code', f).value.trim().toUpperCase(), o = getOrder(v);
    if (!o) return toast('Kode booking tidak ditemukan.', 'alert');
    if (o.status === 'ready' || o.status === 'inuse') { scanRun++; S.h = { mode: o.status === 'ready' ? 'out' : 'in', code: o.code, phase: 'idle', found: [], scenario: 'normal', alien: null }; render(); }
    else { toast(`${o.code} belum bisa diserahterimakan.`, 'alert'); go('order', o.code); }
  },
};
document.addEventListener('click', e => {
  readRenter();
  const t = e.target.closest('[data-act],[data-go]');
  if (!t || t.disabled) return;
  if (t.dataset.act) { const fn = A[t.dataset.act]; if (fn) { e.preventDefault(); fn(t.dataset, t, e); } return; }
  e.preventDefault(); go(t.dataset.go, t.dataset.code);
});
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.ch; if (k && CH[k]) CH[k](e.target); });
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.in; if (k && IN[k]) IN[k](e.target); });
document.addEventListener('submit', e => { const k = e.target.dataset && e.target.dataset.form; if (k && FORMS[k]) { e.preventDefault(); readRenter(); FORMS[k](e.target); } });
document.addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]'), tip = $('#tip');
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false;
  tip.style.left = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = (e.clientY - 38) + 'px';
});
/* A booking made in the renter tab appears here without a reload */
window.addEventListener('storage', e => {
  if (e.key !== RENTER_KEY) return;
  readRenter();
  const typing = /INPUT|SELECT|TEXTAREA/.test((document.activeElement || {}).tagName || '');
  if (!typing && S.h.phase !== 'scanning' && S.staff) render();
});
load();
const START = NAV.map(n => n[0]);
if (START.includes(location.hash.slice(1))) S.page = location.hash.slice(1);
render();
</script>
</body>
</html>
