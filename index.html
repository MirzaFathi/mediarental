      .steps4 {
        grid-template-columns: 1fr 1fr;
        row-gap: 32px
      }

      .steps4::before {
        display: none
      }

      .benefits,
      .testis {
        grid-template-columns: 1fr
      }

      .faq {
        grid-template-columns: 1fr;
        gap: 16px
      }

      .foot-in {
        grid-template-columns: 1fr 1fr
      }

      .two-col,
      .cat-layout,
      .prof {
        grid-template-columns: minmax(0, 1fr)
      }

      .sticky,
      .filters {
        position: static
      }

      .filters {
        display: none
      }

      .filters.open {
        display: block
      }

      .f-toggle {
        display: inline-flex
      }

      .tiers {
        grid-template-columns: 1fr;
        gap: 28px
      }

      .tier.best {
        transform: none;
        order: -1
      }

      .opts {
        grid-template-columns: 1fr 1fr
      }

      .b3 {
        grid-template-columns: 1fr
      }

      .auth {
        grid-template-columns: 1fr
      }

      .auth-side {

    <div>${FAQ.map((f, i) => `<details class="qa" ${i === 0 ? 'open' : ''}><summary>${f[0]}${ic('chevD')}</summary><p>${f[1]}</p></details>`).join('')}</div>

  <section class="wrap"><div class="cta-band"><div><h2>Bingung pilih alat? Ceritakan kegiatanmu, kami racik paketnya.</h2><p>Gratis, kurang dari satu menit.</p></div><button class="btn btn-accent btn-lg" data-go="reco">${ic('sparkles')} Bantu Saya Memilih</button></div></section>`;
    };

    /* Catalog */
    function filteredItems() {
      const c = S.catalog;
      const q = c.q.trim().toLowerCase();
      let list = ITEMS.filter(it => {
        if (q && !(it.name + ' ' + it.brand + ' ' + catOf(it.cat).name).toLowerCase().includes(q)) return false;
        if (c.cats.length && !c.cats.includes(it.cat)) return false;
        if (c.brands.length && !c.brands.includes(it.brand)) return false;
        if (it.price > c.maxPrice) return false;
        if (c.start && c.end && !isAvail(it, c.start, c.end)) return false;
        return true;
      });
      const s = { pop: (a, b) => b.rented - a.rented, low: (a, b) => a.price - b.price, high: (a, b) => b.price - a.price, rating: (a, b) => b.rating - a.rating }[c.sort];
      return list.sort(s);
    }
    function gridHTML() {
      const list = filteredItems();
      const dm = !!(S.catalog.start && S.catalog.end);
      return list.length ? list.map(i => pcard(i, dm)).join('') : `<div style="grid-column:1/-1">${emptyState('search', 'Tidak ada alat yang cocok', 'Coba kurangi filter atau ubah kata kunci pencarian.', '<button class="btn btn-outline" data-act="resetFilters">Atur ulang filter</button>')}</div>`;
    }
    function renderGrid() {
      const g = $('#grid'); if (!g) return;
      g.innerHTML = gridHTML();
      $('#count').textContent = filteredItems().length + ' alat';
    }
    PAGES.catalog = () => {
      const c = S.catalog;
      return `<div class="wrap page">
    ${crumbs([['Beranda', 'home'], ['Katalog']])}
    <h1 class="page-title">Katalog Alat</h1>
    <p class="page-sub">Semua unit dicek setelah dipakai dan punya tag RFID. Harga per hari, belum termasuk deposit yang dikembalikan.</p>
    <div class="cat-layout">
      <aside class="filters ${S.ui.filters ? 'open' : ''}" id="filters" aria-label="Filter">
        <div class="f-head"><b>Filter</b><button class="link-btn" data-act="resetFilters">Atur ulang</button></div>
        <div class="f-group"><h4>Kategori</h4>${CATS.map(k => `<label class="chk"><input type="checkbox" data-ch="fCat" value="${k.id}" ${c.cats.includes(k.id) ? 'checked' : ''}><span>${k.name}</span><small>${ITEMS.filter(i => i.cat === k.id).length}</small></label>`).join('')}</div>
        <div class="f-group"><h4>Harga per hari</h4><input type="range" id="f-price" min="15000" max="300000" step="5000" value="${c.maxPrice}" data-in="fPrice" aria-label="Harga maksimal per hari"><div class="range-lbl"><span>Rp15.000</span><b id="f-price-v">maks. ${rp(c.maxPrice)}</b></div></div>
        <div class="f-group"><h4>Tersedia pada tanggal</h4><div class="date-pair">
          <label class="field"><span>Ambil</span><input type="date" class="inp" id="f-start" data-ch="fStart" value="${c.start}" min="${iso(TODAY)}"></label>
          <label class="field"><span>Kembali</span><input type="date" class="inp" id="f-end" data-ch="fEnd" value="${c.end}" min="${c.start || iso(TODAY)}"></label></div>
          <p style="font-size:12.5px;color:var(--ink-3);margin-top:8px">Alat yang penuh di rentang ini disembunyikan.</p></div>
        <div class="f-group"><h4>Merek</h4><div class="brand-list">${BRANDS.map(b => `<label class="chk"><input type="checkbox" data-ch="fBrand" value="${b}" ${c.brands.includes(b) ? 'checked' : ''}><span>${b}</span></label>`).join('')}</div></div>
      </aside>
      <section style="min-width:0">
        <div class="toolbar">
          <div class="search-inp">${ic('search')}<input id="cat-q" type="search" placeholder="Cari nama alat atau merek" value="${esc(c.q)}" data-in="fQ" aria-label="Cari di katalog"></div>
          <button class="btn btn-outline f-toggle" data-act="toggleFilters">${ic('filter', 'sm')} Filter</button>
          <select class="inp" id="cat-sort" data-ch="fSort" aria-label="Urutkan">${[['pop', 'Terpopuler'], ['low', 'Harga terendah'], ['high', 'Harga tertinggi'], ['rating', 'Rating tertinggi']].map(o => `<option value="${o[0]}" ${c.sort === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>
          <span class="count num" id="count">${filteredItems().length} alat</span>
        </div>
        <div class="grid" id="grid">${gridHTML()}</div>
      </section>
    </div></div>`;
    };

    /* Item detail */
    function monthHTML(m, it) {
      const y = m.getFullYear(), mo = m.getMonth();
      const lead = (new Date(y, mo, 1).getDay() + 6) % 7, n = new Date(y, mo + 1, 0).getDate();
      const s = S.book.start, e = S.book.end;
      let cells = '';
      for (let i = 0; i < lead; i++) cells += '<span></span>';
      for (let d = 1; d <= n; d++) {
        const dt = new Date(y, mo, d), k = iso(dt), off = offOf(dt);
        const past = off < 0, bk = !past && it.booked.includes(off);
        let cls = past ? 'past' : bk ? 'booked' : '';
        if (s && k === s) cls += ' start';
        if (e && k === e) cls += ' end';
        if (s && e && k > s && k < e) cls += ' inrange';
        if (off === 0) cls += ' today';
        cells += `<button class="cd ${cls}" data-act="pickDate" data-date="${k}" ${past || bk ? 'disabled' : ''} aria-label="${fDate(dt)}${bk ? ', penuh' : ''}">${d}</button>`;
      }
      return `<div class="cal-m"><div class="cal-title">${m.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' })}</div><div class="cal-grid">${['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map(w => `<span class="wd">${w}</span>`).join('')}${cells}</div></div>`;
    }
    function calHTML(it) {
      const base = new Date(TODAY.getFullYear(), TODAY.getMonth() + S.book.monthOff, 1);
      const next = new Date(base.getFullYear(), base.getMonth() + 1, 1);
      return `<div class="cal-head"><button class="icon-btn" data-act="calMove" data-dir="-1" ${S.book.monthOff <= 0 ? 'disabled' : ''} aria-label="Bulan sebelumnya">${ic('chevL')}</button>
    <span class="muted" style="font-size:13.5px">Klik tanggal ambil, lalu tanggal kembali</span>
    <button class="icon-btn" data-act="calMove" data-dir="1" ${S.book.monthOff >= 4 ? 'disabled' : ''} aria-label="Bulan berikutnya">${ic('chevR')}</button></div>
    <div class="cal-months">${monthHTML(base, it)}${monthHTML(next, it)}</div>
    <div class="cal-legend"><span><i style="background:var(--surface);border:1.5px solid var(--line)"></i>Tersedia</span><span><i style="background:var(--surface-2)"></i>Penuh</span><span><i style="background:var(--navy)"></i>Pilihanmu</span><span><i style="background:var(--accent);border-radius:50%;width:6px;height:6px"></i>Hari ini</span></div>`;
    }
    function panelHTML(it) {
      const b = S.book, ok = b.start && b.end, days = ok ? daysBetween(b.start, b.end) : 0, avail = ok && isAvail(it, b.start, b.end);
      const sub = it.price * b.qty * days;
      return `<div class="panel-price"><strong>${rp(it.price)}</strong><span> /hari</span></div>
    <div class="d-meta" style="font-size:13.5px"><span class="rt">${ic('star', 'star sm')} ${it.rating}</span><span>${it.rented}× disewa</span><span>Stok ${it.stock} unit</span></div>
    <div class="date-pair">
      <label class="field"><span>Tanggal ambil</span><input type="date" class="inp" id="bk-start" data-ch="bkStart" value="${b.start || ''}" min="${iso(TODAY)}"></label>
      <label class="field"><span>Tanggal kembali</span><input type="date" class="inp" id="bk-end" data-ch="bkEnd" value="${b.end || ''}" min="${b.start || iso(TODAY)}"></label></div>
    <div class="date-pair">
      <label class="field"><span>Jam ambil</span><select class="inp" id="bk-time" data-ch="bkTime">${TIMES.map(t => `<option ${S.cart.time === t ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <div class="field"><span>Jumlah unit</span>${stepper('bkQty', b.qty)}</div></div>
    ${ok ? (avail ? `<div class="note ok">${ic('check')}<span>Tersedia ${fShort(b.start)} – ${fShort(b.end)} (${days} hari)</span></div>` : `<div class="note bad">${ic('alert')}<span>Penuh di sebagian tanggal ini. Pilih rentang lain di kalender.</span></div>`) : `<div class="note">${ic('calendar')}<span>Pilih tanggal kembali.</span></div>`}
    <div>
      <div class="sum-row"><span>${rp(it.price)} × ${b.qty} unit × ${days || 0} hari</span><span class="num">${rp(sub)}</span></div>
      <div class="sum-row"><span>Deposit keamanan<small>Dikembalikan setelah alat dicek</small></span><span class="num">${rp(it.deposit * b.qty)}</span></div>
    </div>
    <button class="btn btn-accent btn-lg btn-block" data-act="addToCart" ${ok && avail ? '' : 'disabled'}>${ic('cart')} Tambah ke Keranjang</button>
    <button class="btn btn-outline btn-block" data-act="rentNow" ${ok && avail ? '' : 'disabled'}>Sewa Sekarang</button>
    <div class="panel-foot">${ic('radio')}<span>Unit ber-tag RFID. Saat diambil dan dikembalikan, alat cukup dipindai di gerbang dan tercatat otomatis.</span></div>`;
    }
    const INCL_IC = s => /baterai/i.test(s) ? 'battery' : /charger|kabel|daya/i.test(s) ? 'plug' : /kartu sd|sd /i.test(s) ? 'sd' : /tas|case|pouch/i.test(s) ? 'bag' : 'check';
    function galleryMain(it) {
      const v = S.book.view;
      if (v === 2) return `<div class="kit">${it.incl.map(x => `<div class="kit-it">${ic(INCL_IC(x))}<span>${esc(x)}</span></div>`).join('')}</div>`;
      return art(it, v === 1 ? 'flip' : '', true);
    }
    PAGES.item = () => {
      const it = item(S.params.id);
      if (!it) return `<div class="wrap page">${emptyState('search', 'Alat tidak ditemukan', 'Alat ini mungkin sudah tidak tersedia.', '<button class="btn btn-navy" data-go="catalog">Ke katalog</button>')}</div>`;
      const cat = catOf(it.cat);
      return `<div class="wrap page">
    ${crumbs([['Beranda', 'home'], ['Katalog', 'catalog'], [it.name]])}
    <div class="two-col" style="margin-top:6px">
      <div class="stack" style="gap:30px">
        <div>
          <div class="gallery-main" id="gal">${galleryMain(it)}</div>
          <div class="thumbs" role="tablist" aria-label="Foto alat">${['Tampak depan', 'Tampak samping', 'Kelengkapan'].map((t, i) => `<button class="${S.book.view === i ? 'on' : ''}" data-act="galView" data-v="${i}" aria-label="${t}" role="tab" aria-selected="${S.book.view === i}">${i === 2 ? `<div class="kit-th">${ic('package')}</div>` : art(it, i === 1 ? 'flip' : '')}</button>`).join('')}</div>
        </div>
        <div class="d-head">
          <div class="row" style="flex-wrap:wrap"><span class="pill pill-navy">${ic(cat.icon)}${cat.name}</span><span class="pill">${it.brand}</span>${it.booked.includes(0) ? `<span class="pill pill-warn">Penuh hari ini</span>` : `<span class="pill pill-ok">Tersedia hari ini</span>`}</div>
          <h1>${esc(it.name)}</h1>
          <p class="muted" style="font-size:16px;max-width:640px">${it.desc}</p>
        </div>
        <section><h3 style="font-size:19px;margin-bottom:10px">Spesifikasi</h3>
          <dl class="specs" style="margin:0">${it.specs.map(s => `<div><dt>${s[0]}</dt><dd>${s[1]}</dd></div>`).join('')}<div><dt>Tag RFID</dt><dd class="mono" style="font-size:13px">${tagId(it.id, 0)}</dd></div></dl></section>
        <section><h3 style="font-size:19px;margin-bottom:12px">Kelengkapan yang kamu terima</h3>
          <div class="incl">${it.incl.map(x => `<span>${ic('check')}${esc(x)}</span>`).join('')}</div></section>
        <section class="card card-pad"><div class="between" style="margin-bottom:12px;flex-wrap:wrap"><h3 style="font-size:19px">Kalender ketersediaan</h3><span class="muted" style="font-size:13.5px">Diperbarui real-time dari sistem toko</span></div>
          <div id="cal">${calHTML(it)}</div></section>
      </div>
      <aside class="card panel sticky" id="panel">${panelHTML(it)}</aside>
    </div>
    <section class="sec" style="padding-bottom:0"><div class="sec-head"><div><span class="kicker">Sering disewa bersama</span><h2>Lengkapi ${esc(it.name)}</h2></div></div>
      <div class="together">${it.with.map(id => pcard(item(id))).join('')}</div></section>
  </div>`;
    };
    function rerenderBook() {
      const it = item(S.params.id);
      if ($('#cal')) $('#cal').innerHTML = calHTML(it);
      if ($('#panel')) $('#panel').innerHTML = panelHTML(it);
    }

    /* Recommendation */
    function recoTiers() {
      const r = S.reco;
      return TIERS[r.activity].map((t, i) => {
        let lines = t.lines.map(([id, q]) => [id, q]);
        if (r.level === 'pemula' && i < 2) lines = lines.map(([id, q]) => [id === 'a6400' ? 'zve10' : id, q]);
        const daily = packDaily(lines);
        const total = Math.round(daily * 0.9 * r.days);
        const deposit = lines.reduce((a, [id, q]) => a + item(id).deposit * q, 0);
        const s = r.start, e = iso(addDays(parseIso(r.start), r.days));
        const busy = lines.filter(([id]) => !isAvail(item(id), s, e)).map(([id]) => item(id).name);
        return { ...t, i, lines, daily, total, deposit, fits: total <= r.budget, busy };
      });
    }
    function bestTier(tiers) {
      const r = S.reco;
      if (r.level === 'mahir' && tiers[2].fits) return 2;
      if (tiers[1].fits) return 1;
      if (tiers[0].fits) return 0;
      return 0;
    }
    PAGES.reco = () => {
      const r = S.reco;
      const labels = ['Kegiatan', 'Pengalaman', 'Durasi & budget', 'Rekomendasi'];
      const pct = [12, 38, 66, 100][r.step - 1];
      return `<section class="reco-band"><div class="wrap">
      <span class="hero-chip">${ic('sparkles')} Asisten rekomendasi</span>
      <h1>Ceritakan kebutuhanmu, kami racik paket alatnya.</h1>
      <p>Tiga pertanyaan singkat. Hasilnya tiga pilihan paket dari hemat sampai pro, lengkap dengan total harga dan alasan kenapa cocok.</p>
      <div class="progress" aria-label="Langkah ${r.step} dari 4"><div class="prog-bar"><i style="width:${pct}%"></i></div>
        <div class="prog-steps">${labels.map((l, i) => `<span class="${i + 1 < r.step ? 'done' : i + 1 === r.step ? 'on' : ''}"><em>${i + 1 < r.step ? '✓' : i + 1}</em>${l}</span>`).join('')}</div></div>
    </div></section>
    <div class="wrap"><div class="reco-card">${r.loading ? `<div class="loading"><div class="spinner"></div><h3>Mencocokkan ${ITEMS.length} alat dengan kebutuhanmu…</h3><p class="muted">Mengecek kompatibilitas mount, ketersediaan tanggal, dan budget.</p></div>` : recoStep()}</div></div>
    <div style="height:20px"></div>`;
    };
    function recoStep() {
      const r = S.reco;
      if (r.step === 1) return `<h2 class="reco-q">Mau dipakai untuk kegiatan apa?</h2><p class="reco-qs">Pilih satu yang paling mendekati.</p>
    <div class="opts">${ACTS.map(a => `<button class="opt ${r.activity === a.id ? 'on' : ''}" data-act="recoAct" data-v="${a.id}" aria-pressed="${r.activity === a.id}"><span class="oi">${ic(a.icon)}</span><span><b>${a.name}</b><small>${a.sub}</small></span><span class="chk-dot">${ic('check')}</span></button>`).join('')}</div>
    <div class="reco-nav"><span class="muted" style="font-size:14px">Langkah 1 dari 3</span><button class="btn btn-accent btn-lg" data-act="recoNext" ${r.activity ? '' : 'disabled'}>Lanjut ${ic('arrowR', 'sm')}</button></div>`;

          <div class="store-box">${ic('store')}<div><b>${STORE.name}</b><p class="muted" style="font-size:14px">${STORE.addr}<br>${STORE.hours.join(' · ')}</p></div></div>

    };
    function summaryHTML(p, days) {

    }
    function ckSteps(n) {
      return `<div class="ck-steps">${['Keranjang', 'Checkout', 'Pembayaran', 'Selesai'].map((t, i) => `${i ? '<i class="sep"></i>' : ''}<span class="${i + 1 < n ? 'done' : i + 1 === n ? 'on' : ''}"><em>${i + 1 < n ? '✓' : i + 1}</em>${t}</span>`).join('')}</div>`;

    /* Checkout */

    </div></div>`;
    };

    /* Payment */
    const PM = {
      qris: { group: 'QRIS', name: 'QRIS', sq: 'QR' },
      gopay: { group: 'E-Wallet', name: 'GoPay', sq: 'GP' }, ovo: { group: 'E-Wallet', name: 'OVO', sq: 'OV' }, dana: { group: 'E-Wallet', name: 'DANA', sq: 'DA' }, spay: { group: 'E-Wallet', name: 'ShopeePay', sq: 'SP' },
      bca: { group: 'Transfer Bank (Virtual Account)', name: 'BCA', sq: 'BCA', va: '3901' }, mandiri: { group: 'Transfer Bank (Virtual Account)', name: 'Mandiri', sq: 'MDR', va: '8960' }, bni: { group: 'Transfer Bank (Virtual Account)', name: 'BNI', sq: 'BNI', va: '9881' }, bri: { group: 'Transfer Bank (Virtual Account)', name: 'BRI', sq: 'BRI', va: '2626' },
    };
    PAGES.payment = () => {
      const o = getOrder(S.params.code);
      if (!o) return `<div class="wrap page">${emptyState('card', 'Tidak ada tagihan', 'Pesanan tidak ditemukan.', '<button class="btn btn-navy" data-go="orders">Pesanan saya</button>')}</div>`;

      const m = PM[S.pay.method];

      const va = m.va ? m.va + ' ' + (S.user.phone || '081233445566').replace(/\D/g, '').slice(0, 12).replace(/(\d{4})(?=\d)/g, '$1 ') : '';
      let inst;
      if (m.group === 'QRIS') inst = `<div class="pay-box">${qrSVG('QRIS' + o.code)}<div class="stack" style="gap:8px"><b style="font-size:18px">Scan QRIS dengan aplikasi apa saja</b><p class="muted" style="font-size:14px">GoPay, OVO, DANA, ShopeePay, LinkAja, atau m-banking.</p><dl class="kv" style="margin:0;font-size:14px"><dt>Merchant</dt><dd>MEDIA EQUIPMENT RENTAL SBY</dd><dt>NMID</dt><dd class="mono">ID10264519873</dd></dl></div></div>`;
      else if (m.group === 'E-Wallet') inst = `<div class="stack" style="gap:12px"><label class="field" style="max-width:320px"><span>Nomor ${m.name}</span><input class="inp" id="ew-no" value="${esc(S.user.phone || '')}" inputmode="tel"></label><ol class="ol"><li>Tagihan dikirim ke aplikasi ${m.name} setelah kamu menekan tombol bayar.</li><li>Buka notifikasi di aplikasi, periksa nominal, lalu konfirmasi dengan PIN.</li></ol></div>`;
      else inst = `<div class="stack" style="gap:6px"><span class="muted" style="font-size:14px">Nomor Virtual Account ${m.name}</span><div class="row" style="flex-wrap:wrap"><span class="va" id="va-no">${va}</span><button class="btn btn-outline btn-sm" data-act="copy" data-text="${va.replace(/\s/g, '')}">${ic('copy', 'sm')} Salin</button></div><ol class="ol"><li>Buka m-banking atau ATM ${m.name}, pilih Transfer › Virtual Account.</li><li>Masukkan nomor di atas. Nama penerima: MEDIA EQUIPMENT RENTAL.</li><li>Pastikan nominal ${rp(o.total)} lalu konfirmasi.</li></ol></div>`;

    <div class="two-col">
      <div class="stack">
        <section class="card card-pad pm-group">${groups.map(g => `<h4>${g}</h4><div class="pm-opts">${Object.entries(PM).filter(([, v]) => v.group === g).map(([k, v]) => `<button class="pm ${S.pay.method === k ? 'on' : ''}" data-act="payMethod" data-v="${k}" aria-pressed="${S.pay.method === k}"><span class="logo-sq">${v.sq}</span>${v.name}</button>`).join('')}</div>`).join('')}</section>
        <section class="card card-pad"><h3 style="margin-bottom:16px">Cara bayar · ${m.name}</h3>${inst}</section>
        <div class="demo"><h4>${ic('info', 'sm')} Simulasi pembayaran</h4><p>Prototipe ini tidak memproses uang sungguhan. Tekan tombol di samping untuk mensimulasikan pembayaran berhasil.</p></div>

        <div class="between" style="margin-bottom:12px"><span class="muted">Kode booking</span><b class="mono">${o.code}</b></div>

        ${o.discount ? `<div class="sum-row disc"><span>Hemat paket</span><span class="num">−${rp(o.discount)}</span></div>` : ''}
        <div class="sum-row"><span>Biaya layanan</span><span class="num">${rp(o.fee)}</span></div>
        <div class="sum-row"><span>Deposit keamanan</span><span class="num">${rp(o.deposit)}</span></div>
        <div class="sum-row total"><span>Total</span><span class="num">${rp(o.total)}</span></div>
        <button class="btn btn-accent btn-lg btn-block" style="margin-top:16px" data-act="paySim">${ic('check')} ${m.group === 'E-Wallet' ? 'Kirim tagihan & bayar' : 'Saya sudah bayar'}</button>
        <button class="btn btn-outline btn-block" style="margin-top:8px" data-act="payLater">Bayar nanti</button>
      </aside>
    </div></div>`;
    };

    /* Success */
    PAGES.success = () => {
      const o = getOrder(S.params.code);
      if (!o) return PAGES.orders();
      return `<div class="wrap page">${ckSteps(4)}<div class="success">
    <div class="ok-ic">${ic('check')}</div>
    <h1 class="page-title">Booking berhasil!</h1>
    <p class="muted" style="font-size:16px;margin-top:8px">Pembayaran ${rp(o.total)} via ${esc(o.method)} sudah diterima. Kami kirim pengingat sehari sebelum jadwal ambil.</p>
    <div class="card ticket">
      <div class="ticket-qr">${qrSVG(o.code)}<span class="code">${o.code}</span><small class="muted">Tunjukkan QR ini di kasir</small></div>
      <div class="ticket-info">
        <dl class="kv" style="margin:0"><dt>Ambil</dt><dd>${fDT(o.pickupAt)}</dd><dt>Kembali</dt><dd>${fDT(o.dueAt)}</dd><dt>Lokasi</dt><dd>${STORE.addr}</dd><dt>Alat</dt><dd>${o.lines.map(l => (l.qty > 1 ? l.qty + '× ' : '') + item(l.id).name).join(', ')}</dd></dl>

        <div class="row" style="flex-wrap:wrap"><button class="btn btn-navy" data-go="order" data-code="${o.code}">Lihat status pesanan</button><button class="btn btn-outline" data-act="copy" data-text="${o.code}">${ic('copy', 'sm')} Salin kode</button></div>
      </div>
    </div></div></div>`;
    };

    /* Orders */
    PAGES.orders = () => {
      const act = S.orders.filter(o => o.status !== 'completed'), hist = S.orders.filter(o => o.status === 'completed');
      const list = S.ordersTab === 'aktif' ? act : hist;

          : emptyState('package', S.ordersTab === 'aktif' ? 'Tidak ada pesanan aktif' : 'Belum ada riwayat', 'Pesanan yang sedang berjalan dan yang sudah selesai akan muncul di sini.', '<button class="btn btn-navy" data-go="catalog">Mulai sewa</button>')}</div>
  </div>`;
    };
    function statusPill(o) {

  </article>`;
    }

    /* Order detail */
    function rfidBox(e) {
      return `<div class="rfid-box"><div class="rfid-head">${ic('radio')} Tercatat via RFID · ${e.gate} · ${fDT(e.at)}</div>
    ${e.tags.map(t => `<div class="rfid-row"><span>${ic('check', 'sm')} ${esc(t.name)}</span><span class="mono">${t.tag}</span></div>`).join('')}
    <div class="rfid-row" style="background:var(--surface-2)"><b>${e.tags.length} dari ${e.tags.length} alat terdeteksi</b><span class="pill pill-ok">Lengkap</span></div></div>`;
    }
    function stepBody(o, k, state) {
      const ev = o.events[k];
      const out = o.rfid.find(r => r.type === 'out'), inn = o.rfid.find(r => r.type === 'in');
      const t = ev ? `<span class="t">${fDT(ev)}</span>` : '';
      const title = STEPS.find(s => s.k === k).t;
      let p = '';
      if (k === 'pending') p = state === 'done' ? `Dibayar via ${esc(o.method || '—')}.` : 'Selesaikan pembayaran agar alat dikunci untuk tanggalmu.';
      if (k === 'confirmed') p = state === 'done' ? 'Pembayaran diterima, alat dikunci untuk tanggalmu.' : state === 'cur' ? 'Pembayaran diterima. Staf sedang menyiapkan dan mengecek alat.' : '';
      if (k === 'ready') p = state === 'cur' ? `Alat sudah dicek dan siap. Datang ${fDT(o.pickupAt)} dan tunjukkan QR booking.` : state === 'done' ? 'Alat dicek lengkap dan disiapkan di meja pengambilan.' : `Perkiraan: ${fDT(o.pickupAt - 3 * HOUR)}`;
      if (k === 'pickedup') p = state === 'done' && out ? rfidBox(out) : `Jadwal ambil: ${fDT(o.pickupAt)}. Alat akan dipindai di gerbang RFID.`;
      if (k === 'inuse') p = state === 'cur' ? (Date.now() > o.dueAt ? `<span style="color:var(--bad);font-weight:700">Batas pengembalian ${fDT(o.dueAt)} sudah lewat.</span>` : `Sisa waktu <b class="mono" data-cd="${o.dueAt}">${hms(o.dueAt - Date.now())}</b> · kembali paling lambat ${fDT(o.dueAt)}`) : state === 'done' ? `Dipakai ${o.days} hari.` : `Sampai ${fDT(o.dueAt)}`;
      if (k === 'returned') p = state === 'done' || state === 'cur' ? ((inn ? rfidBox(inn) : '') + (state === 'cur' ? '<p style="margin-top:8px">Staf sedang mengecek kondisi alat (±30 menit).</p>' : '')) : `Batas: ${fDT(o.dueAt)}`;
      if (k === 'completed') p = state === 'done' ? `Deposit ${rp(o.deposit - (o.lateFee || 0))} dikembalikan ke rekening refund${o.lateFee ? ` (dipotong denda ${rp(o.lateFee)})` : ''}.` : 'Deposit dikembalikan maksimal 1×24 jam setelah alat dicek.';

      else if (o.status === 'pending') alert = `<div class="alert warn">${ic('card')}<div><b>Menunggu pembayaran</b><p>Alat belum dikunci sampai pembayaran diterima.</p></div></div>`;

        ready: ['simPickup', 'radio', 'Scan RFID pengambilan'],

      return `<div class="wrap page">
    ${crumbs([['Beranda', 'home'], ['Pesanan Saya', 'orders'], [o.code]])}

      <div><div class="row" style="flex-wrap:wrap"><h1 class="page-title mono" style="letter-spacing:.02em">${o.code}</h1>${statusPill(o)}</div>

      <div class="stack">
        ${alert}
        <section class="card card-pad"><h3 style="margin-bottom:20px">Status pesanan</h3>

        </section>
        <section class="card card-pad"><h3 style="margin-bottom:6px">Alat dalam pesanan</h3>
          ${o.lines.map(l => { const it = item(l.id); return `<div class="line">${art(it, 'thumb')}<div class="line-main"><b>${l.qty > 1 ? l.qty + '× ' : ''}${esc(it.name)}</b><small>Kelengkapan: ${it.incl.join(', ')}</small><small class="mono">${Array.from({ length: l.qty }, (_, i) => tagId(l.id, i)).join(' · ')}</small></div><span class="line-sub num">${rp(it.price * l.qty * o.days)}</span></div>`; }).join('')}</section>
        <section class="card card-pad"><h3 style="margin-bottom:12px">Log RFID</h3>
          ${o.rfid.length ? `<div class="tbl-wrap"><table class="log-table"><thead><tr><th>Waktu</th><th>Kejadian</th><th>Gerbang</th><th>Alat</th></tr></thead><tbody>${o.rfid.map(e => `<tr><td class="mono">${fDT(e.at)}</td><td><span class="pill ${e.type === 'out' ? 'pill-navy' : 'pill-ok'}">${e.type === 'out' ? 'Keluar' : 'Masuk'}</span></td><td>${e.gate}</td><td>${e.tags.length} tag terbaca</td></tr>`).join('')}</tbody></table></div>`
          : `<p class="muted" style="font-size:14px">Belum ada scan. Log muncul otomatis saat alat dipindai di gerbang toko.</p>`}
        </section>
        ${o.status === 'completed' ? reviewHTML(o) : ''}
      </div>
      <aside class="stack sticky">
        ${o.status === 'inuse' ? `<div class="cd-card"><small>${rem > 0 ? 'Sisa waktu sewa' : 'Lewat batas waktu'}</small><div class="countdown" data-cd="${o.dueAt}">${hms(rem)}</div><div class="lbl">JAM : MENIT : DETIK</div><p style="margin-top:10px;font-size:14px;opacity:.85">Kembali paling lambat ${fDT(o.dueAt)}</p></div>` : ''}
        ${['confirmed', 'ready', 'pending'].includes(o.status) ? `<div class="card card-pad" style="text-align:center"><h3 style="margin-bottom:12px">QR pengambilan</h3><div style="display:flex;justify-content:center">${qrSVG(o.code)}</div><p class="mono" style="font-weight:700;margin-top:10px">${o.code}</p><p class="muted" style="font-size:13px">${o.status === 'pending' ? 'Aktif setelah pembayaran diterima.' : 'Tunjukkan di kasir saat ambil alat.'}</p></div>` : ''}
        <div class="card card-pad"><h3 style="margin-bottom:10px">Rincian pembayaran</h3>
          <div class="sum-row"><span>Biaya sewa</span><span class="num">${rp(o.rent)}</span></div>
          ${o.discount ? `<div class="sum-row disc"><span>Hemat paket</span><span class="num">−${rp(o.discount)}</span></div>` : ''}
          <div class="sum-row"><span>Biaya layanan</span><span class="num">${rp(o.fee)}</span></div>
          <div class="sum-row"><span>Deposit<small>${o.status === 'completed' ? 'Sudah dikembalikan' : 'Ditahan sampai alat kembali'}</small></span><span class="num">${rp(o.deposit)}</span></div>
          ${o.lateFee ? `<div class="sum-row"><span>Denda keterlambatan</span><span class="num" style="color:var(--bad)">${rp(o.lateFee)}</span></div>` : ''}
          <div class="sum-row total"><span>Total dibayar</span><span class="num">${rp(o.total)}</span></div>
          <p class="muted" style="font-size:13px;margin-top:6px">${o.method ? 'Metode: ' + esc(o.method) : 'Belum dibayar'}</p></div>
        ${o.status !== 'completed' ? `<div class="card card-pad"><h3 style="margin-bottom:8px;display:flex;gap:8px;align-items:center">${ic('info', 'sm')} Denda keterlambatan</h3><p class="muted" style="font-size:14px">10% tarif harian per jam (${rp(o.daily * 0.1)}/jam untuk pesanan ini), maksimal 150% tarif harian per hari. Dipotong dari deposit.</p></div>` : ''}
        ${sim ? `<div class="demo"><h4>${ic('zap', 'sm')} Mode demo</h4><p>Di sistem asli, status ini diperbarui oleh staf toko dan gerbang RFID. Klik untuk mensimulasikan langkah berikutnya.</p>
          <button class="btn btn-navy btn-block" data-act="${sim[0]}" data-code="${o.code}">${ic(sim[1], 'sm')} ${sim[2]}</button>
          ${o.status === 'inuse' && rem > 0 ? `<button class="btn btn-outline btn-block btn-sm" style="margin-top:8px" data-act="simLate" data-code="${o.code}">Simulasikan terlambat 3 jam</button>` : ''}</div>` : ''}
      </aside>
    </div></div>`;
    };
    function reviewHTML(o) {
      if (o.review) return `<section class="card card-pad"><h3 style="margin-bottom:10px">Ulasanmu</h3><div class="row">${stars(o.review.stars)}</div><p style="margin-top:8px">${esc(o.review.text)}</p><p class="muted" style="font-size:13px;margin-top:6px">Dikirim ${fDate(o.review.at)}</p></section>`;
      return `<section class="card card-pad"><h3>Bagaimana pengalaman sewamu?</h3><p class="muted" style="font-size:14px;margin:4px 0 14px">Ulasanmu membantu penyewa lain memilih alat.</p>
    <form class="stack" style="gap:14px" data-form="review" data-code="${o.code}">
      <div class="stars-in" role="radiogroup" aria-label="Rating">${[1, 2, 3, 4, 5].map(n => `<button type="button" class="${S.rating >= n ? 'on' : ''}" data-act="rate" data-v="${n}" aria-label="${n} bintang">${ic('star')}</button>`).join('')}</div>
      <label class="field"><span>Ulasan</span><textarea class="inp" id="rv-text" name="text" placeholder="Kondisi alat, proses ambil & kembali, pelayanan staf…"></textarea></label>
      <button class="btn btn-accent" type="submit" style="align-self:flex-start">Kirim ulasan</button></form></section>`;
    }

    /* Profile */
    PAGES.profile = () => {
      const u = S.user, t = S.profileTab;
      const tabs = [['data', 'user', 'Data diri'], ['verif', 'shield', 'Verifikasi'], ['bayar', 'wallet', 'Metode pembayaran'], ['sk', 'file', 'Syarat & ketentuan']];
      let body = '';
      if (t === 'data') body = `<section class="card card-pad"><h3 style="margin-bottom:18px">Data diri</h3>
    <form class="form-grid" data-form="profile">
      <label class="field full"><span>Nama lengkap</span><input class="inp" id="pf-name" name="pf_name" value="${esc(u.name)}"></label>
      <label class="field"><span>Email</span><input class="inp" id="pf-email" name="pf_email" type="email" value="${esc(u.email || '')}"></label>
      <label class="field"><span>Nomor HP / WhatsApp</span><input class="inp" id="pf-phone" name="pf_phone" value="${esc(u.phone || '')}"></label>
      <label class="field"><span>Kampus / instansi</span><input class="inp" id="pf-campus" name="pf_campus" value="${esc(u.campus || '')}"></label>
      <label class="field"><span>Domisili</span><input class="inp" id="pf-addr" name="pf_address" value="${esc(u.address || '')}"></label>
      <div class="full"><button class="btn btn-navy" type="submit">Simpan perubahan</button></div></form></section>`;
      if (t === 'verif') {
        const v = u.verified;
        body = `<section class="card card-pad stack" style="gap:18px"><h3>Verifikasi identitas</h3>
      <div class="verif-card ${v === 'verified' ? '' : v === 'review' ? 'pend' : 'none'}"><span class="vi">${ic(v === 'verified' ? 'shield' : v === 'review' ? 'clock' : 'alert', 'lg')}</span>
        <div><b style="font-size:17px">${v === 'verified' ? 'Terverifikasi' : v === 'review' ? 'Sedang ditinjau' : 'Belum terverifikasi'}</b>
        <p class="muted" style="font-size:14px">${v === 'verified' ? `${u.idType} · ${esc(u.idNo || '')} · ${esc(u.idFile || '')}. Kamu bisa menyewa semua alat.` : v === 'review' ? 'Tim kami sedang mencocokkan data. Biasanya kurang dari 1 jam (simulasi: beberapa detik).' : 'Unggah KTM atau KTP untuk bisa checkout.'}</p></div></div>
      ${v === 'verified' ? `<div class="note">${ic('info')}<span>Bawa ${u.idType} asli saat pengambilan pertama. Untuk mengganti dokumen, hubungi admin via WhatsApp.</span></div>` : v === 'review' ? '' : verifyForm('verifyProfile')}
    </section>`;
      }
      if (t === 'bayar') body = `<section class="card card-pad"><div class="between"><h3>Metode pembayaran tersimpan</h3></div>
    <div style="margin-top:8px">${S.pays.length ? S.pays.map((p, i) => `<div class="pm-saved"><span class="logo-sq" style="width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--navy);color:var(--navy-ink);font-weight:800;font-size:12px">${esc(p.name.slice(0, 3).toUpperCase())}</span><div><b>${esc(p.name)}</b> ${p.def ? '<span class="pill pill-ok" style="margin-left:6px">Utama</span>' : ''}<br><small>${esc(p.detail)}</small></div>${p.def ? '' : `<button class="link-btn" data-act="payDef" data-i="${i}">Jadikan utama</button>`}<button class="icon-btn" data-act="payDel" data-i="${i}" aria-label="Hapus">${ic('trash', 'sm')}</button></div>`).join('') : '<p class="empty-sm">Belum ada metode tersimpan.</p>'}</div>
    <form class="form-grid" style="margin-top:18px;padding-top:18px;border-top:1px solid var(--line)" data-form="addPay">
      <label class="field"><span>Jenis</span><select class="inp" id="ap-name" name="ptype">${['GoPay', 'OVO', 'DANA', 'ShopeePay', 'BCA', 'Mandiri', 'BNI', 'BRI'].map(n => `<option>${n}</option>`).join('')}</select></label>
      <label class="field"><span>Nomor HP / rekening</span><input class="inp" id="ap-no" name="no" required placeholder="0812xxxx atau no. rekening"></label>
      <div class="full"><button class="btn btn-outline" type="submit">${ic('plus', 'sm')} Tambah metode</button></div></form>
    <p class="muted" style="font-size:13px;margin-top:12px">Rekening bank dipakai untuk pengembalian deposit.</p></section>`;
      if (t === 'sk') body = `<section class="card card-pad"><h3 style="margin-bottom:18px">Syarat & ketentuan sewa</h3><ol class="terms">${TERMS.map(x => `<li><div><b>${x[0]}</b><p>${x[1]}</p></div></li>`).join('')}</ol></section>`;
      return `<div class="wrap page">
    ${crumbs([['Beranda', 'home'], ['Profil']])}
    <h1 class="page-title">Profil</h1>
    <div class="prof">
      <nav class="card prof-nav" aria-label="Menu profil"><div class="prof-id"><span class="avatar">${initials(u.name)}</span><div><b>${esc(u.name)}</b><small>${esc(u.campus || u.email || '')}</small></div></div>
        ${tabs.map(x => `<button class="${t === x[0] ? 'on' : ''}" data-act="profTab" data-v="${x[0]}">${ic(x[1])} ${x[2]}</button>`).join('')}</nav>
      <div class="stack">${body}</div>
    </div></div>`;
    };

    /* ---------- Router ---------- */
    const AUTH_ROUTES = ['checkout', 'payment', 'orders', 'order', 'profile'];
    function go(route, params = {}) {
      if (AUTH_ROUTES.includes(route) && !S.user) {
        S.auth.tab = 'login'; S.auth.step = 1;
        S.params = { next: route, nextParams: params };
        S.route = 'auth';
        toast('Masuk dulu untuk melanjutkan.', 'lock');
      } else {
        if (route === 'catalog' && params.cat) S.catalog = Object.assign(freshCatalog(), { cats: [params.cat] });
        if (route === 'item') S.book = { start: S.cart.start, end: S.cart.end, qty: 1, view: 0, monthOff: 0 };
        if (route === 'order') S.rating = 0;
        if (route === 'auth' && !params.next) { S.auth.tab = 'login'; S.auth.step = 1; }
        S.route = route; S.params = params;
      }
      S.ui.open = null; S.ui.mobileNav = false; S.ui.filters = false;
      render();
      window.scrollTo(0, 0);
    }
    const freshCatalog = () => ({ q: '', cats: [], brands: [], maxPrice: 300000, start: '', end: '', sort: 'pop' });
    function render() {
      renderNav();
      $('#main').innerHTML = (PAGES[S.route] || PAGES.home)();
      save();
    }

    /* ---------- Toast & modal ---------- */
    function toast(msg, icon = 'check', action) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML = `${ic(icon)}<span>${esc(msg)}</span>${action ? `<button data-go="${action[1]}">${action[0]}</button>` : ''}`;
      $('#toasts').appendChild(el);
      setTimeout(() => el.remove(), 3600);
    }
    function scanModal(o, type, done) {
      const e = rfidEntry(o, type, Date.now());
      $('#modal').innerHTML = `<div class="modal-back" role="dialog" aria-modal="true" aria-label="Pemindaian RFID"><div class="modal">
    <div class="scan-ring" id="scan-ring">${ic('radio')}</div>
    <h3 id="scan-title" style="font-size:20px">Memindai tag RFID…</h3>
    <p class="muted" style="font-size:14px;margin-top:4px">${e.gate} · ${o.code}</p>
    <ul class="scan-list" id="scan-list"></ul>
    <button class="btn btn-navy btn-block" id="scan-done" data-act="closeModal" disabled>Menunggu…</button></div></div>`;
      e.tags.forEach((t, i) => setTimeout(() => {
        const li = document.createElement('li');
        li.innerHTML = `${ic('check')}<div><b>${esc(t.name)}</b><small>${t.tag}</small></div>`;
        $('#scan-list') && $('#scan-list').appendChild(li);
      }, 700 + i * 550));
      setTimeout(() => {
        if (!$('#scan-ring')) return;
        $('#scan-ring').classList.add('done'); $('#scan-ring').innerHTML = ic('check');
        $('#scan-title').textContent = `${e.tags.length} dari ${e.tags.length} alat terdeteksi`;
        const b = $('#scan-done'); b.disabled = false; b.textContent = 'Lihat status pesanan';
        e.at = Date.now();
        done(e);
      }, 900 + e.tags.length * 550);
    }

    /* ---------- Actions ---------- */
    function requireDates(it) {
      if (!isAvail(it, S.cart.start, S.cart.end)) { toast(`${it.name} penuh di tanggal keranjangmu. Pilih tanggal lain.`, 'alert'); go('item', { id: it.id }); return false; }
      return true;
    }
    function addPackLines(lines, name, start, days) {
      S.cart.start = start; S.cart.end = iso(addDays(parseIso(start), days));
      lines.forEach(([id, q]) => addLine(id, q, lines.length >= 3 ? name : null));
    }
    const A = {
      toggleDD: d => { S.ui.open = S.ui.open === d.dd ? null : d.dd; renderNav(); },
      toggleMobile: () => { S.ui.mobileNav = !S.ui.mobileNav; renderNav(); },
      readAll: () => { S.notifs.forEach(n => n.read = true); renderNav(); save(); },
      openNotif: d => { const n = S.notifs.find(x => x.id === d.nid); if (n) { n.read = true; if (n.order && getOrder(n.order)) return go('order', { code: n.order }); } renderNav(); save(); },
      logout: () => { S.user = null; S.orders = []; S.notifs = []; S.pays = []; go('home'); toast('Kamu sudah keluar.', 'logout'); },
      resetDemo: () => { try { localStorage.removeItem(LS); } catch (e) { } location.reload(); },
      heroTag: d => { S.catalog = Object.assign(freshCatalog(), { q: d.q }); go('catalog'); },
      toastOnly: d => toast(d.msg, 'mail'),
      quickAdd: d => {
        const it = item(d.id);
        if (!requireDates(it)) return;
        addLine(it.id, 1); renderNav(); save();
        toast(`${it.name} masuk keranjang (${fShort(parseIso(S.cart.start))}–${fShort(parseIso(S.cart.end))}).`, 'cart', ['Lihat', 'cart']);
      },
      resetFilters: () => { S.catalog = freshCatalog(); render(); },
      toggleFilters: () => { S.ui.filters = !S.ui.filters; $('#filters').classList.toggle('open', S.ui.filters); },
      galView: d => { S.book.view = +d.v; const it = item(S.params.id); $('#gal').innerHTML = galleryMain(it); document.querySelectorAll('.thumbs button').forEach((b, i) => { b.classList.toggle('on', i === +d.v); b.setAttribute('aria-selected', i === +d.v); }); },
      calMove: d => { S.book.monthOff = Math.max(0, Math.min(4, S.book.monthOff + +d.dir)); rerenderBook(); },
      pickDate: d => {
        const b = S.book, it = item(S.params.id), k = d.date;
        if (!b.start || b.end || k <= b.start) { b.start = k; b.end = null; }
        else if (!isAvail(it, b.start, k)) { toast('Ada tanggal penuh di antara pilihanmu. Pilih rentang lain.', 'alert'); b.start = k; b.end = null; }
        else b.end = k;
        rerenderBook();
      },
      bkQty: d => { const it = item(S.params.id); S.book.qty = Math.max(1, Math.min(it.stock, S.book.qty + +d.dir)); rerenderBook(); },
      addToCart: () => {
        const it = item(S.params.id), b = S.book;
        const changed = S.cart.lines.length && (S.cart.start !== b.start || S.cart.end !== b.end);
        S.cart.start = b.start; S.cart.end = b.end;
        addLine(it.id, b.qty); renderNav(); save();
        toast(changed ? `${it.name} ditambahkan. Tanggal sewa keranjang ikut diperbarui.` : `${it.name} masuk keranjang.`, 'cart', ['Lihat', 'cart']);
      },
      rentNow: () => { A.addToCart(); go('cart'); },
      recoAct: d => { S.reco.activity = d.v; render(); },
      recoLvl: d => { S.reco.level = d.v; render(); },
      recoNext: () => { S.reco.step++; render(); },
      recoBack: () => { S.reco.step--; render(); },
      recoJump: d => { S.reco.step = +d.v; render(); },
      recoDays: d => { S.reco.days = +d.v; render(); },
      recoDaysStep: d => { S.reco.days = Math.max(1, Math.min(14, S.reco.days + +d.dir)); render(); },
      recoBudgetSet: d => { S.reco.budget = +d.v; render(); },
      recoGo: () => { S.reco.step = 4; S.reco.loading = true; render(); setTimeout(() => { S.reco.loading = false; if (S.route === 'reco') render(); }, 900); },
      recoReset: () => { Object.assign(S.reco, { step: 1, activity: null, level: null }); render(); },
      rentTier: d => { const t = recoTiers()[+d.t]; addPackLines(t.lines, 'Paket ' + t.title, S.reco.start, S.reco.days); go('cart'); toast(`Paket ${t.title} masuk keranjang.`, 'cart'); },
      customTier: d => { const t = recoTiers()[+d.t]; S.custom = { name: 'Paket ' + t.title, lines: t.lines.map(([id, qty]) => ({ id, qty })), days: S.reco.days, start: S.reco.start }; go('custom'); },
      rentPkg: d => { const p = PACKS.find(x => x.id === d.pid); const bad = p.lines.filter(([id]) => !isAvail(item(id), S.cart.start, S.cart.end)); if (bad.length) { toast(`${item(bad[0][0]).name} penuh di tanggal keranjang. Atur paket untuk menggantinya.`, 'alert'); return A.customPkg(d); } addPackLines(p.lines, p.name, S.cart.start, cartDays()); go('cart'); toast(`${p.name} masuk keranjang.`, 'cart'); },
      customPkg: d => { const p = PACKS.find(x => x.id === d.pid); S.custom = { name: p.name, lines: p.lines.map(([id, qty]) => ({ id, qty })), days: cartDays(), start: S.cart.start }; go('custom'); },
      czQty: d => { const l = S.custom.lines[+d.i]; l.qty = Math.max(1, Math.min(item(l.id).stock, l.qty + +d.dir)); render(); },
      czDel: d => { S.custom.lines.splice(+d.i, 1); render(); },
      czAdd: d => { S.custom.lines.push({ id: d.id, qty: 1 }); render(); },
      czDays: d => { S.custom.days = Math.max(1, Math.min(14, S.custom.days + +d.dir)); render(); },
      czToCart: () => {
        const c = S.custom, e = iso(addDays(parseIso(c.start), c.days));
        const bad = c.lines.filter(l => !isAvail(item(l.id), c.start, e));
        if (bad.length) return toast(`${item(bad[0].id).name} penuh di tanggal ini. Tukar dengan alat lain atau ubah tanggal.`, 'alert');
        addPackLines(c.lines.map(l => [l.id, l.qty]), c.name, c.start, c.days); go('cart'); toast(`${c.name} masuk keranjang.`, 'cart');
      },
      cartQty: d => { const l = S.cart.lines[+d.i]; l.qty = Math.max(1, Math.min(item(l.id).stock, l.qty + +d.dir)); render(); },
      cartDel: d => { const l = S.cart.lines.splice(+d.i, 1)[0]; render(); toast(`${item(l.id).name} dihapus dari keranjang.`, 'trash'); },
      clearCart: () => { S.cart.lines = []; render(); },
      toCheckout: () => go('checkout'),
      showTerms: () => { $('#modal').innerHTML = `<div class="modal-back" role="dialog" aria-modal="true"><div class="modal" style="text-align:left;max-width:560px;max-height:85vh;overflow:auto"><h3 style="font-size:20px;margin-bottom:16px">Syarat & ketentuan sewa</h3><ol class="terms">${TERMS.map(x => `<li><div><b>${x[0]}</b><p>${x[1]}</p></div></li>`).join('')}</ol><button class="btn btn-navy btn-block" style="margin-top:20px" data-act="closeModal">Mengerti</button></div></div>`; },
      closeModal: () => { $('#modal').innerHTML = ''; render(); },
      placeOrder: () => {
        const c = S.cart;
        const o = mkOrder({ lines: c.lines.map(l => ({ ...l })), start: c.start, end: c.end, time: c.time });
        S.orders.unshift(o);
        S.pay = { method: 'qris', deadline: Date.now() + 15 * MIN };
        go('payment', { code: o.code });
      },
      payOrder: d => { S.pay = { method: 'qris', deadline: Date.now() + 15 * MIN }; go('payment', { code: d.code }); },
      payMethod: d => { S.pay.method = d.v; render(); },
      paySim: () => {
        const o = getOrder(S.params.code), m = PM[S.pay.method];
        o.status = 'confirmed'; o.method = m.group.startsWith('Transfer') ? 'VA ' + m.name : m.name;
        o.events.pending = o.events.pending || Date.now(); o.events.confirmed = Date.now();
        S.cart.lines = [];
        pushNotif('pay', 'Pembayaran diterima', `${o.code} dikonfirmasi. Ambil alat ${fDT(o.pickupAt)} di toko Kertajaya.`, o.code);
        pushNotif('pickup', 'Pengingat pengambilan', `Jangan lupa: ${o.code} diambil ${fDT(o.pickupAt)}. Bawa ${S.user.idType || 'KTM/KTP'} asli.`, o.code);
        go('success', { code: o.code });
      },
      payLater: () => { S.cart.lines = []; go('orders'); toast('Pesanan disimpan. Bayar dari halaman Pesanan Saya.', 'clock'); },
      copy: d => {
        const ok = () => toast('Disalin: ' + d.text, 'copy');
        try { navigator.clipboard.writeText(d.text).then(ok, () => toast('Salin manual: ' + d.text, 'copy')); } catch (e) { toast('Salin manual: ' + d.text, 'copy'); }
      },
      ordersTab: d => { S.ordersTab = d.v; render(); },
      rentAgain: d => {
        const o = getOrder(d.code);
        S.cart.lines = o.lines.map(l => ({ id: l.id, qty: l.qty, pkg: null }));
        S.cart.start = iso(addDays(TODAY, 1)); S.cart.end = iso(addDays(TODAY, 1 + o.days)); S.cart.time = o.time;
        go('cart'); toast('Alat dari ' + o.code + ' masuk keranjang. Cek tanggalnya.', 'refresh');
      },
      simReady: d => { const o = getOrder(d.code); o.status = 'ready'; o.events.ready = Date.now(); pushNotif('pickup', 'Alat siap diambil', `${o.code} sudah dicek dan siap. Jadwal ambil ${fDT(o.pickupAt)}.`, o.code); render(); toast('Status: Siap Diambil', 'package'); },
      simPickup: d => {
        const o = getOrder(d.code);
        scanModal(o, 'out', e => { o.rfid.push(e); o.status = 'inuse'; o.events.pickedup = e.at; o.events.inuse = e.at; pushNotif('rfid', 'Scan RFID berhasil', `${e.tags.length} alat tercatat keluar untuk ${o.code} di Gerbang 1, pukul ${fTime(e.at)}.`, o.code); save(); renderNav(); });
      },
      simReturn: d => {
        const o = getOrder(d.code);
        scanModal(o, 'in', e => { o.rfid.push(e); o.status = 'returned'; o.events.returned = e.at; o.lateFee = lateInfo(o, e.at).fee; pushNotif('rfid', 'Pengembalian tercatat', `${e.tags.length} alat ${o.code} tercatat masuk di Gerbang 2, pukul ${fTime(e.at)}.${o.lateFee ? ' Denda ' + rp(o.lateFee) + '.' : ''}`, o.code); save(); renderNav(); });
      },
      simComplete: d => { const o = getOrder(d.code); o.status = 'completed'; o.events.completed = Date.now(); pushNotif('deposit', 'Deposit dikembalikan', `Deposit ${rp(o.deposit - o.lateFee)} untuk ${o.code} sudah dikembalikan.`, o.code); render(); toast('Pesanan selesai. Deposit dikembalikan.', 'wallet'); },
      simLate: d => { const o = getOrder(d.code); o.dueAt = Date.now() - 3 * HOUR - 5 * MIN; render(); toast('Waktu disimulasikan: lewat 3 jam dari batas.', 'clock'); },
      rate: d => { S.rating = +d.v; document.querySelectorAll('.stars-in button').forEach((b, i) => b.classList.toggle('on', i < S.rating)); },
      authTab: d => { S.auth.tab = d.v; S.auth.step = 1; render(); },
      idType: d => { S.auth.idType = d.v; render(); },
      regSkip: () => { S.user = { name: S.auth.name, email: S.auth.contact.includes('@') ? S.auth.contact : '', phone: S.auth.contact.includes('@') ? '' : S.auth.contact, verified: 'none' }; S.orders = []; S.notifs = []; S.pays = []; S.auth.step = 3; render(); },
      authDone: () => { const p = S.params; S.auth = { tab: 'login', step: 1, idType: 'KTM', file: null, preview: null, name: '', contact: '' }; p.next ? go(p.next, p.nextParams || {}) : go('catalog'); },
      profTab: d => { S.profileTab = d.v; render(); },
      payDef: d => { S.pays.forEach((p, i) => p.def = i === +d.i); render(); },
      payDel: d => { S.pays.splice(+d.i, 1); render(); },
    };
    const CH = {
      fCat: t => { const c = S.catalog.cats; t.checked ? c.push(t.value) : c.splice(c.indexOf(t.value), 1); renderGrid(); },
      fBrand: t => { const c = S.catalog.brands; t.checked ? c.push(t.value) : c.splice(c.indexOf(t.value), 1); renderGrid(); },
      fSort: t => { S.catalog.sort = t.value; renderGrid(); },
      fStart: t => { S.catalog.start = t.value; if (S.catalog.end && S.catalog.end <= t.value) { S.catalog.end = ''; $('#f-end').value = ''; } $('#f-end').min = t.value; renderGrid(); },
      fEnd: t => { S.catalog.end = t.value; renderGrid(); },
      bkStart: t => { if (!t.value) return; S.book.start = t.value; if (!S.book.end || S.book.end <= t.value) S.book.end = iso(addDays(parseIso(t.value), 1)); rerenderBook(); },
      bkEnd: t => { if (!t.value || t.value <= S.book.start) { toast('Tanggal kembali harus setelah tanggal ambil.', 'alert'); rerenderBook(); return; } S.book.end = t.value; rerenderBook(); },
      bkTime: t => { S.cart.time = t.value; save(); },
      recoStart: t => { if (t.value) S.reco.start = t.value; },
      czSwap: t => { S.custom.lines[+t.dataset.i].id = t.value; render(); },
      czStart: t => { if (t.value) { S.custom.start = t.value; render(); } },
      ctStart: t => { if (!t.value) return; S.cart.start = t.value; if (S.cart.end <= t.value) S.cart.end = iso(addDays(parseIso(t.value), 1)); render(); },
      ctEnd: t => { if (!t.value || t.value <= S.cart.start) { toast('Tanggal kembali harus setelah tanggal ambil.', 'alert'); render(); return; } S.cart.end = t.value; render(); },
      ctTime: t => { S.cart.time = t.value; render(); },
      agree: t => { S.agree = t.checked; render(); },
      idFile: t => {
        const f = t.files && t.files[0]; if (!f) return;
        S.auth.file = f.name; S.auth.preview = null;
        if (f.type.startsWith('image/') && f.size < 6e6) { const r = new FileReader(); r.onload = () => { S.auth.preview = r.result; render(); }; r.readAsDataURL(f); }
        render();
      },
    };
    const IN = {
      fQ: t => { S.catalog.q = t.value; renderGrid(); },
      fPrice: t => { S.catalog.maxPrice = +t.value; $('#f-price-v').textContent = 'maks. ' + rp(+t.value); renderGrid(); },
      recoBudget: t => { S.reco.budget = +t.value; $('#budget-v').textContent = rp(S.reco.budget); $('#budget-d').textContent = '≈ ' + rp(S.reco.budget / S.reco.days) + ' per hari untuk ' + S.reco.days + ' hari'; },
    };
    function verifValid() {
      const no = $('#vf-no') && $('#vf-no').value.trim();
      if (!S.auth.file) { toast('Unggah foto ' + S.auth.idType + ' terlebih dulu.', 'upload'); return false; }
      if (!no) { toast('Isi ' + (S.auth.idType === 'KTM' ? 'NIM' : 'NIK') + ' terlebih dulu.', 'alert'); return false; }
      return true;
    }
    function submitVerification(after) {
      if (!verifValid()) return;
      const no = $('#vf-no').value.trim();
      Object.assign(S.user, { idType: S.auth.idType, idNo: no, idFile: S.auth.file, verified: 'review' });
      after && after();
      render();
      setTimeout(() => {
        if (S.user && S.user.verified === 'review') {
          S.user.verified = 'verified';
          pushNotif('info', 'Identitas terverifikasi', S.user.idType + ' kamu sudah diverifikasi. Sekarang kamu bisa menyewa alat.');
          toast('Identitas terverifikasi. Kamu siap menyewa!', 'shield');
          if (!$('#modal').innerHTML) render();
        }
      }, 2500);
    }
    const FORMS = {
      heroSearch: f => { S.catalog = Object.assign(freshCatalog(), { q: f.elements.q.value.trim() }); go('catalog'); },
      login: f => {
        const id = f.elements.ident.value.trim();
        S.user = Object.assign({}, DEMO_USER, id.includes('@') ? { email: id } : { phone: id });
        seedDemo();
        const p = S.params;
        toast('Selamat datang, ' + S.user.name.split(' ')[0] + '!', 'user');
        p.next ? go(p.next, p.nextParams || {}) : go('home');
      },
      reg1: f => { S.auth.name = f.elements.fullname.value.trim(); S.auth.contact = f.elements.contact.value.trim(); S.auth.step = 2; render(); },
      reg2: () => {
        if (!verifValid()) return;
        const c = S.auth.contact;
        S.user = { name: S.auth.name, email: c.includes('@') ? c : '', phone: c.includes('@') ? '' : c, verified: 'none' };
        S.orders = []; S.pays = [];
        S.notifs = [{ id: 'nw', type: 'info', title: 'Selamat datang!', text: 'Akunmu sudah dibuat. Coba fitur Rekomendasi untuk menemukan paket yang pas.', at: Date.now(), read: false }];
        submitVerification(() => { S.auth.step = 3; });
      },
      verifyCk: () => submitVerification(),
      verifyProfile: () => submitVerification(),
      review: f => {
        if (!S.rating) return toast('Pilih rating bintang dulu.', 'star');
        const o = getOrder(f.dataset.code);
        o.review = { stars: S.rating, text: f.elements.text.value.trim() || 'Tanpa komentar.', at: Date.now() };
        S.rating = 0; render(); toast('Terima kasih atas ulasanmu!', 'star');
      },
      profile: f => { ['name', 'email', 'phone', 'campus', 'address'].forEach(k => S.user[k] = f.elements['pf_' + k].value.trim()); render(); toast('Profil disimpan.'); },
      addPay: f => { const n = f.elements.ptype.value, no = f.elements.no.value.trim(); const last = no.replace(/\D/g, '').slice(-4); S.pays.push({ type: /BCA|Mandiri|BNI|BRI/.test(n) ? 'bank' : 'ewallet', name: n, detail: '•••• ' + last, def: !S.pays.length }); render(); toast(n + ' ditambahkan.', 'wallet'); },
    };

    /* ---------- Event wiring ---------- */
    document.addEventListener('click', e => {
      if (S.ui.open && !e.target.closest('[data-keep]')) { S.ui.open = null; renderNav(); }
      const t = e.target.closest('[data-act],[data-go]');
      if (!t || t.disabled) return;
      if (t.dataset.go) { e.preventDefault(); const p = Object.assign({}, t.dataset); delete p.go; go(t.dataset.go, p); return; }
      const fn = A[t.dataset.act];
      if (fn) { e.preventDefault(); e.stopPropagation(); fn(t.dataset, t, e); }
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.matches('article[data-go]')) e.target.click();
      if (e.key === 'Escape') { if ($('#modal').innerHTML && !$('#scan-done[disabled]')) A.closeModal(); else if (S.ui.open) { S.ui.open = null; renderNav(); } }
    });
    document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.ch; if (k && CH[k]) CH[k](e.target, e); });
    document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.in; if (k && IN[k]) IN[k](e.target, e); });
    document.addEventListener('submit', e => { const f = e.target, k = f.dataset.form; if (k && FORMS[k]) { e.preventDefault(); FORMS[k](f); } });
    setInterval(() => {
      document.querySelectorAll('[data-cd]').forEach(el => { const left = +el.dataset.cd - Date.now(); el.textContent = el.dataset.fmt === 'ms' ? ms2(left) : hms(left); });
    }, 1000);

    const START = { katalog: 'catalog', rekomendasi: 'reco', paket: 'packages', 'cara-kerja': 'how' };
    renderFoot();
    go(START[location.hash.slice(1)] || 'home');
  </script>
</body>

</html>
