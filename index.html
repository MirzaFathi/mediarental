<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Media Equipment Rental</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">
  <style>
    /* Layout: sticky navbar over a 1200px column; app screens use two columns (filters | grid, content | sticky panel) that stack below 900px */
    :root {
      --bg: #F4F6FB;
      --surface: #FFFFFF;
      --surface-2: #EDF1F9;
      --ink: #0D1730;
      --ink-2: #4F5B76;
      --ink-3: #8790A6;
      --line: #DCE2EE;
      --navy: #14275F;
      --navy-hover: #0E1D4A;
      --navy-ink: #FFFFFF;
      --navy-soft: #E5EBFA;
      --link: #1E3A94;
      --hero: #0D1A44;
      --hero-2: #16285F;
      --hero-3: #21367A;
      --hero-ink: #F3F5FB;
      --hero-mute: #A7B4D8;
      --accent: #F7931E;
      --accent-hover: #E8820B;
      --accent-ink: #1C1205;
      --accent-soft: #FFF0DC;
      --accent-text: #B35F00;
      --ok: #157A46;
      --ok-soft: #E1F4E8;
      --warn: #A85A06;
      --warn-soft: #FFF1DC;
      --bad: #BF3320;
      --bad-soft: #FDE7E3;
      --t-cam: #E2E9FB;
      --t-lens: #E8E5FA;
      --t-sup: #E3ECF1;
      --t-aud: #FCEADB;
      --t-lig: #FBF2D3;
      --art-ink: #1B2B5E;
      --qr-ink: #0D1730;
      --qr-bg: #FFFFFF;
      --shadow: 0 1px 2px rgba(13, 23, 48, .05), 0 6px 20px rgba(13, 23, 48, .06);
      --shadow-lg: 0 24px 60px rgba(13, 23, 48, .16);
      --f-display: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --f-body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
      --r-sm: 10px;
      --r: 14px;
      --r-lg: 20px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #090F22;
        --surface: #111A33;
        --surface-2: #18233F;
        --ink: #E8ECF6;
        --ink-2: #A6B0C7;
        --ink-3: #6E7995;
        --line: #24304E;
        --navy: #2C4AA4;
        --navy-hover: #3657BA;
        --navy-ink: #FFFFFF;
        --navy-soft: #1A2851;
        --link: #9DB4FF;
        --hero: #0B1535;
        --hero-2: #14224D;
        --hero-3: #1E3168;
        --hero-ink: #F3F5FB;
        --hero-mute: #9FADD3;
        --accent: #FF9F33;
        --accent-hover: #FFB45E;
        --accent-ink: #1C1205;
        --accent-soft: #3A2810;
        --accent-text: #FFB45E;
        --ok: #4CC584;
        --ok-soft: #11301F;
        --warn: #F2A54A;
        --warn-soft: #3A2810;
        --bad: #FF7E69;
        --bad-soft: #3D1A15;
        --t-cam: #19254E;
        --t-lens: #211E49;
        --t-sup: #182636;
        --t-aud: #382416;
        --t-lig: #353016;
        --art-ink: #C9D5FF;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
        --shadow-lg: 0 24px 60px rgba(0, 0, 0, .5);
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #090F22;
      --surface: #111A33;
      --surface-2: #18233F;
      --ink: #E8ECF6;
      --ink-2: #A6B0C7;
      --ink-3: #6E7995;
      --line: #24304E;
      --navy: #2C4AA4;
      --navy-hover: #3657BA;
      --navy-ink: #FFFFFF;
      --navy-soft: #1A2851;
      --link: #9DB4FF;
      --hero: #0B1535;
      --hero-2: #14224D;
      --hero-3: #1E3168;
      --hero-ink: #F3F5FB;
      --hero-mute: #9FADD3;
      --accent: #FF9F33;
      --accent-hover: #FFB45E;
      --accent-ink: #1C1205;
      --accent-soft: #3A2810;
      --accent-text: #FFB45E;
      --ok: #4CC584;
      --ok-soft: #11301F;
      --warn: #F2A54A;
      --warn-soft: #3A2810;
      --bad: #FF7E69;
      --bad-soft: #3D1A15;
      --t-cam: #19254E;
      --t-lens: #211E49;
      --t-sup: #182636;
      --t-aud: #382416;
      --t-lig: #353016;
      --art-ink: #C9D5FF;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, .5);
      color-scheme: dark;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--f-body);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      z-index: 60;
      background: var(--surface)
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: var(--f-display);
      margin: 0;
      letter-spacing: -.02em;
      text-wrap: balance;
      line-height: 1.15
    }

    p {
      margin: 0
    }

    button {
      font: inherit;
      color: inherit
    }

    a {
      color: var(--link)
    }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
      border-radius: 6px
    }

    .wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding-left: max(24px, env(safe-area-inset-left, 0px));
      padding-right: max(24px, env(safe-area-inset-right, 0px))
    }

    .muted {
      color: var(--ink-2)
    }

    .mono {
      font-family: var(--f-mono);
      letter-spacing: .02em
    }

    .num {
      font-variant-numeric: tabular-nums
    }

    .ic {
      width: 20px;
      height: 20px;
      flex: none
    }

    .ic.sm {
      width: 16px;
      height: 16px
    }

    .ic.lg {
      width: 26px;
      height: 26px
    }

    .ic.star {
      fill: var(--accent);
      stroke: var(--accent)
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font: 700 14.5px/1.1 var(--f-body);
      padding: 13px 20px;
      border-radius: 12px;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .1s, color .15s;
      text-decoration: none;
      white-space: nowrap
    }

    .btn:active {
      transform: translateY(1px)
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none
    }

    .btn-accent {
      background: var(--accent);
      color: var(--accent-ink)
    }

    .btn-accent:hover:not(:disabled) {
      background: var(--accent-hover)
    }

    .btn-navy {
      background: var(--navy);
      color: var(--navy-ink)
    }

    .btn-navy:hover:not(:disabled) {
      background: var(--navy-hover)
    }

    .btn-outline {
      background: var(--surface);
      border-color: var(--line);
      color: var(--ink)
    }

    .btn-outline:hover:not(:disabled) {
      border-color: var(--link);
      color: var(--link)
    }

    .btn-light {
      background: var(--hero-ink);
      color: var(--hero)
    }

    .btn-light:hover {
      background: var(--accent-soft)
    }

    .btn-ghost-light {
      background: transparent;
      border-color: rgba(255, 255, 255, .28);
      color: var(--hero-ink)
    }

    .btn-ghost-light:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    .btn-sm {
      padding: 9px 14px;
      font-size: 13.5px;
      border-radius: 10px
    }

    .btn-lg {
      padding: 16px 24px;
      font-size: 16px;
      border-radius: 14px
    }

    .btn-block {
      width: 100%
    }

    .link-btn {
      background: none;
      border: 0;
      padding: 0;
      color: var(--link);
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer
    }

    .link-btn:hover {
      text-decoration: underline
    }

    .icon-btn {
      display: inline-grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      position: relative
    }

    .icon-btn:hover:not(:disabled) {
      border-color: var(--link);
      color: var(--link)
    }

    .icon-btn:disabled {
      opacity: .35;
      cursor: not-allowed
    }

    .badge {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 19px;
      height: 19px;
      padding: 0 5px;
      border-radius: 99px;
      background: var(--accent);
      color: var(--accent-ink);
      font: 800 11px/19px var(--f-body);
      text-align: center;
      border: 2px solid var(--surface)
    }

    /* Pills & notes */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font: 700 12px/1.4 var(--f-body);
      background: var(--surface-2);
      color: var(--ink-2);
      white-space: nowrap
    }

    .pill .ic {
      width: 14px;
      height: 14px
    }

    .pill-ok {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .pill-warn {
      background: var(--warn-soft);
      color: var(--warn)
    }

    .pill-bad {
      background: var(--bad-soft);
      color: var(--bad)
    }

    .pill-navy {
      background: var(--navy-soft);
      color: var(--link)
    }

    .pill-accent {
      background: var(--accent-soft);
      color: var(--accent-text)
    }

    .note {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--ink-2);
      font-size: 14px
    }

    .note .ic {
      margin-top: 1px
    }

    .note.ok {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .note.bad {
      background: var(--bad-soft);
      color: var(--bad)
    }

    .note.warn {
      background: var(--warn-soft);
      color: var(--warn)
    }

    .kicker {
      font: 800 12px/1 var(--f-body);
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--accent-text)
    }

    /* Forms */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0
    }

    .field>span {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-2)
    }

    .inp {
      width: 100%;
      min-width: 0;
      padding: 11px 13px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--ink);
      font: 500 15px/1.3 var(--f-body)
    }

    .inp:focus {
      outline: none;
      border-color: var(--link);
      box-shadow: 0 0 0 4px var(--navy-soft)
    }

    textarea.inp {
      resize: vertical;
      min-height: 90px
    }

    .date-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .chk {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      cursor: pointer;
      font-weight: 500
    }

    .chk input {
      width: 18px;
      height: 18px;
      accent-color: var(--navy);
      flex: none
    }

    .chk small {
      margin-left: auto;
      color: var(--ink-3);
      font-weight: 600
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--accent)
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px
    }

    .form-grid .full {
      grid-column: 1/-1
    }

    /* Navbar */
    .nav {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--line)
    }

    .nav-in {
      display: flex;
      align-items: center;
      gap: 28px;
      height: 70px
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0;
      flex: none
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: var(--navy);
      display: grid;
      place-items: center;
      color: var(--navy-ink)
    }

    .logo-mark svg {
      width: 22px;
      height: 22px
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
      text-align: left
    }

    .logo-text b {
      font: 800 16px/1.05 var(--f-display);
      letter-spacing: -.02em
    }

    .logo-text small {
      font: 700 10.5px/1.2 var(--f-body);
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ink-3)
    }

    .menu {
      display: flex;
      gap: 4px;
      flex: 1
    }

    .menu button {
      background: none;
      border: 0;
      padding: 9px 12px;
      border-radius: 10px;
      font-weight: 600;
      color: var(--ink-2);
      cursor: pointer;
      font-size: 14.5px
    }

    .menu button:hover {
      color: var(--ink);
      background: var(--surface-2)
    }

    .menu button.on {
      color: var(--ink);
      font-weight: 800
    }

    .menu button.on::after {
      content: "";
      display: block;
      height: 3px;
      border-radius: 3px;
      background: var(--accent);
      margin-top: 4px
    }

    .menu .reco-link {
      color: var(--accent-text)
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto
    }

    .dd-wrap {
      position: relative
    }

    .avatar-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 4px;
      border-radius: 99px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      cursor: pointer
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-ink);
      display: grid;
      place-items: center;
      font: 800 13px var(--f-body);
      flex: none
    }

    .avatar-btn .nm {
      font-weight: 700;
      font-size: 14px;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .dd {
      position: absolute;
      right: 0;
      top: calc(100% + 10px);
      width: 340px;
      max-width: calc(100vw - 32px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      z-index: 70
    }

    .dd-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line)
    }

    .dd-list {
      max-height: 380px;
      overflow: auto
    }

    .notif {
      display: flex;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 13px 16px;
      background: none;
      border: 0;
      border-bottom: 1px solid var(--line);
      cursor: pointer
    }

    .notif:hover {
      background: var(--surface-2)
    }

    .notif.unread {
      background: var(--navy-soft)
    }

    .notif-ic {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      flex: none;
      background: var(--surface-2);
      color: var(--link)
    }

    .notif-ic.t-rfid {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .notif-ic.t-return {
      background: var(--warn-soft);
      color: var(--warn)
    }

    .notif-ic.t-pickup {
      background: var(--accent-soft);
      color: var(--accent-text)
    }

    .notif-body {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 13.5px;
      min-width: 0
    }

    .notif-body b {
      font-size: 14px
    }

    .notif-body span {
      color: var(--ink-2)
    }

    .notif-body small {
      color: var(--ink-3);
      font-size: 12px
    }

    .dd-user .who {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 12px;
      align-items: center
    }

    .dd-user .who div {
      min-width: 0
    }

    .dd-user .who b {
      display: block
    }

    .dd-user .who small {
      color: var(--ink-3);
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .dd-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 16px;
      background: none;
      border: 0;
      cursor: pointer;
      font-weight: 600;
      text-align: left
    }

    .dd-item:hover {
      background: var(--surface-2)
    }

    .dd-item.danger {
      color: var(--bad)
    }

    .hamb {
      display: none
    }

    .mnav {
      display: none
    }

    /* Hero */
    .hero {
      background: var(--hero);
      color: var(--hero-ink);
      position: relative;
      overflow: hidden
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(600px 380px at 85% 30%, var(--hero-3), transparent 70%),
        linear-gradient(transparent 0 calc(100% - 1px), rgba(255, 255, 255, .04) 0) 0 0/100% 48px,
        linear-gradient(90deg, transparent 0 calc(100% - 1px), rgba(255, 255, 255, .04) 0) 0 0/48px 100%;
      pointer-events: none
    }

    .hero-in {
      position: relative;
      display: grid;
      grid-template-columns: 1.12fr .88fr;
      gap: 48px;
      align-items: center;
      padding-block: 72px 84px
    }

    .hero-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px 7px 10px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .14);
      font-weight: 600;
      font-size: 13.5px;
      color: var(--hero-ink)
    }

    .hero-chip .ic {
      color: var(--accent);
      width: 18px;
      height: 18px
    }

    .hero h1 {
      font-size: clamp(36px, 5vw, 60px);
      font-weight: 800;
      letter-spacing: -.035em;
      line-height: 1.04;
      margin: 20px 0 18px
    }

    .hero h1 .hl {
      color: var(--accent)
    }

    .hero-copy>p {
      font-size: 18px;
      color: var(--hero-mute);
      max-width: 540px
    }

    .hero-search {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border-radius: 18px;
      padding: 8px 8px 8px 20px;
      margin-top: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
      max-width: 600px
    }

    .hero-search .ic {
      color: var(--ink-3)
    }

    .hero-search input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: none;
      font: 600 17px var(--f-body);
      color: var(--ink);
      padding: 14px 0
    }

    .hero-search input:focus {
      outline: none
    }

    .hero-cta {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 18px;
      flex-wrap: wrap
    }

    .hero-cta small {
      color: var(--hero-mute);
      font-size: 14px;
      max-width: 260px
    }

    .hero-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 22px;
      align-items: center;
      font-size: 13.5px;
      color: var(--hero-mute)
    }

    .hero-tags button {
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .12);
      color: var(--hero-ink);
      padding: 5px 12px;
      border-radius: 99px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px
    }

    .hero-tags button:hover {
      border-color: var(--accent)
    }

    .vf {
      position: relative;
      aspect-ratio: 1/0.92;
      max-width: 100%;
      border-radius: 26px;
      background: var(--hero-2);
      border: 1px solid rgba(255, 255, 255, .1);
      display: grid;
      place-items: center
    }

    .vf .corner {
      position: absolute;
      width: 34px;
      height: 34px;
      border: 3px solid var(--hero-ink);
      opacity: .7
    }

    .vf .c1 {
      top: 22px;
      left: 22px;
      border-right: 0;
      border-bottom: 0;
      border-radius: 8px 0 0 0
    }

    .vf .c2 {
      top: 22px;
      right: 22px;
      border-left: 0;
      border-bottom: 0;
      border-radius: 0 8px 0 0
    }

    .vf .c3 {
      bottom: 22px;
      left: 22px;
      border-right: 0;
      border-top: 0;
      border-radius: 0 0 0 8px
    }

    .vf .c4 {
      bottom: 22px;
      right: 22px;
      border-left: 0;
      border-top: 0;
      border-radius: 0 0 8px 0
    }

    .vf .focus {
      position: absolute;
      width: 24%;
      aspect-ratio: 1;
      border: 2px solid var(--accent);
      border-radius: 6px;
      top: 38%;
      left: 38%
    }

    .vf-art {
      width: 72%;
      color: var(--hero-ink)
    }

    .vf-art svg {
      width: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .vf-art .a {
      stroke: var(--accent)
    }

    .vf-read {
      position: absolute;
      bottom: 30px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 18px;
      font: 700 12.5px var(--f-mono);
      color: var(--hero-mute)
    }

    .vf-read .rec {
      color: var(--accent)
    }

    .vf-top {
      position: absolute;
      top: 30px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 14px;
      font: 700 12px var(--f-mono);
      color: var(--hero-mute)
    }

    .float-card {
      position: absolute;
      background: var(--surface);
      color: var(--ink);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: var(--shadow-lg);
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 13px;
      max-width: 250px
    }

    .float-card b {
      display: block;
      font-size: 14px
    }

    .float-card .fi {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      flex: none
    }

    .fc-1 {
      top: 16%;
      left: -34px
    }

    .fc-1 .fi {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .fc-2 {
      bottom: 16%;
      right: -26px
    }

    .fc-2 .fi {
      background: var(--accent-soft);
      color: var(--accent-text)
    }

    .hero-stats {
      display: flex;
      gap: 30px;
      margin-top: 34px;
      flex-wrap: wrap
    }

    .hero-stats div {
      display: flex;
      flex-direction: column
    }

    .hero-stats b {
      font: 800 24px var(--f-display);
      letter-spacing: -.02em
    }

    .hero-stats small {
      color: var(--hero-mute);
      font-size: 13px
    }

    /* Sections */
    .sec {
      padding-block: 76px
    }

    .sec-alt {
      background: var(--surface);
      border-block: 1px solid var(--line)
    }

    .sec-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 30px;
      flex-wrap: wrap
    }

    .sec-head h2 {
      font-size: clamp(26px, 3vw, 36px);
      font-weight: 800;
      margin-top: 10px
    }

    .sec-head p {
      color: var(--ink-2);
      max-width: 560px;
      margin-top: 8px
    }

    .cats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px
    }

    .cat {
      background: var(--tint);
      border: 0;
      border-radius: var(--r-lg);
      padding: 22px 20px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--ink);
      transition: transform .15s
    }

    .cat:hover {
      transform: translateY(-3px)
    }

    .cat .cat-ic {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--surface);
      display: grid;
      place-items: center;
      color: var(--art-ink);
      margin-bottom: 10px
    }

    .cat .cat-ic .ic {
      width: 26px;
      height: 26px
    }

    .cat b {
      font: 800 18px var(--f-display);
      letter-spacing: -.01em
    }

    .cat span {
      color: var(--ink-2);
      font-size: 13.5px
    }

    .cat small {
      margin-top: 8px;
      font-weight: 700;
      color: var(--ink);
      font-size: 13px
    }

    /* Product cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 20px
    }

    .pcard {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform .15s, box-shadow .15s
    }

    .pcard:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow)
    }

    .art {
      background: var(--tint);
      color: var(--art-ink);
      aspect-ratio: 4/3;
      max-width: 100%;
      display: grid;
      place-items: center;
      position: relative
    }

    .art svg {
      width: 66%;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .art .a {
      stroke: var(--accent)
    }

    .art .tag {
      position: absolute;
      top: 10px;
      left: 10px;
      font: 700 10.5px var(--f-mono);
      letter-spacing: .08em;
      padding: 3px 7px;
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink-2);
      display: flex;
      align-items: center;
      gap: 4px
    }

    .art .tag .ic {
      width: 12px;
      height: 12px
    }

    .art.thumb {
      width: 64px;
      height: 52px;
      aspect-ratio: auto;
      border-radius: 12px;
      flex: none
    }

    .art.thumb svg {
      width: 80%;
      stroke-width: 3.4
    }

    .art.mini {
      width: 46px;
      height: 46px;
      aspect-ratio: auto;
      border-radius: 50%;
      border: 3px solid var(--surface);
      flex: none
    }

    .art.mini svg {
      width: 78%;
      stroke-width: 4
    }

    .pc-body {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1
    }

    .pc-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--ink-3);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em
    }

    .pc-meta .rt {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--ink);
      letter-spacing: 0
    }

    .pc-meta .rt .ic {
      width: 14px;
      height: 14px
    }

    .pcard h3 {
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: -.01em
    }

    .pc-avail {
      font-size: 12.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .pc-avail::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor
    }

    .pc-avail.ok {
      color: var(--ok)
    }

    .pc-avail.bad {
      color: var(--warn)
    }

    .pc-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 8px
    }

    .price b {
      font: 800 18px var(--f-display);
      letter-spacing: -.02em
    }

    .price small {
      color: var(--ink-3);
      font-weight: 600;
      margin-left: 2px
    }

    .price s {
      color: var(--ink-3);
      font-size: 13px;
      margin-right: 6px
    }

    .add {
      width: 38px;
      height: 38px;
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink)
    }

    .add:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: var(--accent-ink)
    }

    /* Packages */
    .pkgs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 20px
    }

    .pkg {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .pkg-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px
    }

    .pkg-arts {
      display: flex
    }

    .pkg-arts .art.mini+.art.mini {
      margin-left: -12px
    }

    .pkg h3 {
      font-size: 20px;
      font-weight: 800
    }

    .pkg-for {
      font-size: 13px;
      color: var(--ink-3);
      font-weight: 600
    }

    .pkg-list {
      list-style: none;
      padding: 0;
      margin: 4px 0 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 14px
    }

    .pkg-list li {
      display: flex;
      gap: 8px;
      align-items: flex-start
    }

    .pkg-list .ic {
      width: 17px;
      height: 17px;
      color: var(--ok);
      margin-top: 2px
    }

    .pkg-foot {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px dashed var(--line);
      flex-wrap: wrap
    }

    .pkg-actions {
      display: flex;
      gap: 8px
    }

    /* How it works */
    .steps4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      position: relative;
      counter-reset: s
    }

    .steps4::before {
      content: "";
      position: absolute;
      top: 28px;
      left: 12%;
      right: 12%;
      height: 2px;
      background: repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 14px)
    }

    .step {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .step .sn {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: var(--surface);
      border: 1.5px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--link);
      position: relative;
      margin-bottom: 10px
    }

    .step .sn em {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--navy);
      color: var(--navy-ink);
      font: 800 12px/24px var(--f-body);
      text-align: center;
      font-style: normal
    }

    .step.rf .sn {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink)
    }

    .step h3 {
      font-size: 18px;
      font-weight: 800
    }

    .step p {
      color: var(--ink-2);
      font-size: 14.5px
    }

    .benefits {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px
    }

    .benefit {
      padding: 26px;
      border-radius: var(--r-lg);
      background: var(--bg);
      border: 1px solid var(--line)
    }

    .benefit .bi {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--navy);
      color: var(--navy-ink);
      display: grid;
      place-items: center;
      margin-bottom: 18px
    }

    .benefit h3 {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 8px
    }

    .benefit p {
      color: var(--ink-2)
    }

    .testis {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px
    }

    .testi {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    .testi .stars {
      display: flex;
      gap: 2px
    }

    .testi blockquote {
      margin: 0;
      font-size: 15.5px;
      line-height: 1.6
    }

    .testi .who {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: auto
    }

    .testi .who .avatar {
      background: var(--navy-soft);
      color: var(--link)
    }

    .testi .who small {
      display: block;
      color: var(--ink-3)
    }

    .faq {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 48px
    }

    details.qa {
      border-bottom: 1px solid var(--line);
      padding: 18px 0
    }

    details.qa summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      font-weight: 700;
      font-size: 16.5px
    }

    details.qa summary::-webkit-details-marker {
      display: none
    }

    details.qa summary .ic {
      transition: transform .2s;
      color: var(--ink-3)
    }

    details.qa[open] summary .ic {
      transform: rotate(180deg)
    }

    details.qa p {
      color: var(--ink-2);
      margin-top: 10px;
      max-width: 640px
    }

    .cta-band {
      background: var(--navy);
      color: var(--navy-ink);
      border-radius: 26px;
      padding: 44px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      position: relative;
      overflow: hidden
    }

    .cta-band h2 {
      font-size: clamp(24px, 3vw, 34px);
      font-weight: 800;
      max-width: 560px
    }

    .cta-band p {
      opacity: .8;
      margin-top: 8px
    }

    /* Footer */
    .foot {
      background: var(--hero);
      color: var(--hero-mute);
      margin-top: 80px
    }

    .foot-in {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1.2fr 1fr;
      gap: 36px;
      padding-block: 56px 30px
    }

    .foot h4 {
      color: var(--hero-ink);
      font-size: 14px;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 14px
    }

    .foot .logo-text b {
      color: var(--hero-ink)
    }

    .foot .logo-text small {
      color: var(--hero-mute)
    }

    .foot .logo-mark {
      background: var(--accent);
      color: var(--accent-ink)
    }

    .foot ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 9px;
      font-size: 14px
    }

    .foot li {
      display: flex;
      gap: 10px;
      align-items: flex-start
    }

    .foot li .ic {
      width: 17px;
      height: 17px;
      margin-top: 2px;
      color: var(--accent)
    }

    .foot button.fl {
      background: none;
      border: 0;
      padding: 0;
      color: var(--hero-mute);
      cursor: pointer;
      font-size: 14px
    }

    .foot button.fl:hover {
      color: var(--hero-ink)
    }

    .foot-bot {
      border-top: 1px solid rgba(255, 255, 255, .1);
      padding-block: 20px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px
    }

    /* Generic page */
    .page {
      padding-block: 36px 20px
    }

    .crumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      color: var(--ink-3);
      margin-bottom: 18px;
      flex-wrap: wrap
    }

    .crumbs button {
      background: none;
      border: 0;
      padding: 0;
      color: var(--ink-2);
      cursor: pointer;
      font-weight: 600
    }

    .crumbs button:hover {
      color: var(--link)
    }

    .crumbs .ic {
      width: 14px;
      height: 14px
    }

    .page-title {
      font-size: clamp(28px, 3.4vw, 40px);
      font-weight: 800
    }

    .page-sub {
      color: var(--ink-2);
      margin-top: 8px;
      max-width: 640px
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg)
    }

    .card-pad {
      padding: 22px
    }

    .card h3 {
      font-size: 17px;
      font-weight: 800
    }

    .two-col {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 32px;
      align-items: start;
      margin-top: 26px
    }

    .sticky {
      position: sticky;
      top: calc(env(safe-area-inset-top, 0px) + 90px)
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-width: 0
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px
    }

    .sum-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      font-size: 14.5px
    }

    .sum-row span:first-child {
      color: var(--ink-2)
    }

    .sum-row.total {
      border-top: 1px solid var(--line);
      margin-top: 8px;
      padding-top: 14px;
      font-weight: 800;
      font-size: 17px
    }

    .sum-row.total span:first-child {
      color: var(--ink)
    }

    .sum-row.disc span:last-child {
      color: var(--ok);
      font-weight: 700
    }

    .sum-row small {
      display: block;
      color: var(--ink-3);
      font-size: 12.5px
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px
    }

    .empty .ei {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: var(--surface-2);
      display: grid;
      place-items: center;
      color: var(--ink-3)
    }

    .empty .ei .ic {
      width: 34px;
      height: 34px
    }

    .empty h3 {
      font-size: 20px
    }

    .empty-sm {
      padding: 24px 16px;
      text-align: center;
      color: var(--ink-3)
    }

    /* Catalog */
    .cat-layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 32px;
      margin-top: 26px;
      align-items: start
    }

    .filters {
      position: sticky;
      top: calc(env(safe-area-inset-top, 0px) + 90px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 6px 20px 14px
    }

    .f-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--line)
    }

    .f-group {
      padding: 16px 0;
      border-bottom: 1px solid var(--line)
    }

    .f-group:last-child {
      border-bottom: 0
    }

    .f-group h4 {
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 8px;
      font-weight: 800
    }

    .range-lbl {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--ink-3);
      margin-top: 4px
    }

    .range-lbl b {
      color: var(--ink)
    }

    .brand-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 8px
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap
    }

    .search-inp {
      flex: 1;
      min-width: 200px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      padding: 0 12px
    }

    .search-inp:focus-within {
      border-color: var(--link);
      box-shadow: 0 0 0 4px var(--navy-soft)
    }

    .search-inp .ic {
      color: var(--ink-3)
    }

    .search-inp input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: none;
      padding: 11px 0;
      font: 500 15px var(--f-body);
      color: var(--ink)
    }

    .search-inp input:focus {
      outline: none
    }

    .toolbar select {
      width: auto
    }

    .count {
      font-size: 14px;
      color: var(--ink-2)
    }

    .f-toggle {
      display: none
    }

    /* Item detail */
    .gallery-main {
      border-radius: 24px;
      overflow: hidden
    }

    .gallery-main .art {
      aspect-ratio: 16/11
    }

    .gallery-main .art svg {
      width: 52%;
      stroke-width: 2.2
    }

    .gallery-main .art.flip svg {
      transform: scaleX(-1) rotate(-6deg);
      width: 60%
    }

    .gallery-main .kit {
      aspect-ratio: 16/11;
      background: var(--surface-2);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      padding: 28px;
      align-content: center
    }

    .kit-it {
      background: var(--surface);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-weight: 700;
      font-size: 13.5px
    }

    .kit-it .ic {
      color: var(--link)
    }

    .thumbs {
      display: flex;
      gap: 10px;
      margin-top: 12px
    }

    .thumbs button {
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 0;
      background: none;
      cursor: pointer;
      overflow: hidden;
      width: 96px
    }

    .thumbs button.on {
      border-color: var(--accent)
    }

    .thumbs .art {
      aspect-ratio: 4/3
    }

    .thumbs .art svg {
      width: 62%
    }

    .thumbs .kit-th {
      aspect-ratio: 4/3;
      background: var(--surface-2);
      display: grid;
      place-items: center;
      color: var(--link)
    }

    .d-head {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .d-head h1 {
      font-size: clamp(28px, 3vw, 38px);
      font-weight: 800
    }

    .d-meta {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--ink-2);
      font-size: 14px
    }

    .d-meta .rt {
      display: flex;
      gap: 4px;
      align-items: center;
      color: var(--ink);
      font-weight: 700
    }

    .specs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 24px
    }

    .specs div {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14.5px
    }

    .specs dt {
      color: var(--ink-2)
    }

    .specs dd {
      margin: 0;
      font-weight: 700;
      text-align: right
    }

    .incl {
      display: flex;
      flex-wrap: wrap;
      gap: 10px
    }

    .incl span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border-radius: 12px;
      background: var(--surface-2);
      font-weight: 600;
      font-size: 14px
    }

    .incl .ic {
      width: 17px;
      height: 17px;
      color: var(--ok)
    }

    .cal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px
    }

    .cal-months {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px
    }

    .cal-title {
      font-weight: 800;
      text-transform: capitalize;
      margin-bottom: 10px;
      text-align: center
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      text-align: center
    }

    .cal-grid .wd {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-3);
      padding: 4px 0
    }

    .cd {
      aspect-ratio: 1;
      border: 0;
      border-radius: 10px;
      background: none;
      cursor: pointer;
      font: 600 14px var(--f-body);
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      position: relative;
      min-width: 0
    }

    .cd:hover:not(:disabled) {
      background: var(--navy-soft)
    }

    .cd.today::after {
      content: "";
      position: absolute;
      bottom: 5px;
      left: 50%;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      transform: translateX(-50%)
    }

    .cd.past {
      color: var(--ink-3);
      opacity: .45;
      cursor: default
    }

    .cd.booked {
      background: var(--surface-2);
      color: var(--ink-3);
      text-decoration: line-through;
      cursor: not-allowed
    }

    .cd.inrange {
      background: var(--navy-soft);
      border-radius: 0
    }

    .cd.start,
    .cd.end {
      background: var(--navy);
      color: var(--navy-ink)
    }

    .cd.start:hover,
    .cd.end:hover {
      background: var(--navy-hover)
    }

    .cal-legend {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 14px;
      font-size: 13px;
      color: var(--ink-2)
    }

    .cal-legend span {
      display: flex;
      align-items: center;
      gap: 7px
    }

    .cal-legend i {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      display: inline-block
    }

    .panel {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow)
    }

    .panel-price strong {
      font: 800 30px var(--f-display);
      letter-spacing: -.03em
    }

    .panel-price span {
      color: var(--ink-3);
      font-weight: 600
    }

    .panel-foot {
      display: flex;
      gap: 10px;
      font-size: 13px;
      color: var(--ink-2);
      padding-top: 12px;
      border-top: 1px solid var(--line)
    }

    .panel-foot .ic {
      color: var(--accent-text);
      width: 18px;
      height: 18px;
      margin-top: 1px
    }

    .stepper {
      display: inline-flex;
      align-items: center;
      border: 1.5px solid var(--line);
      border-radius: 11px;
      overflow: hidden;
      flex: none
    }

    .stepper button {
      width: 34px;
      height: 34px;
      border: 0;
      background: var(--surface);
      cursor: pointer;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink)
    }

    .stepper button:hover {
      background: var(--surface-2)
    }

    .stepper span {
      min-width: 30px;
      text-align: center;
      font-weight: 800;
      font-variant-numeric: tabular-nums
    }

    .together {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px
    }

    /* Recommendation */
    .reco-band {
      background: var(--hero);
      color: var(--hero-ink);
      padding-block: 52px 120px;
      position: relative;
      overflow: hidden
    }

    .reco-band::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(500px 300px at 15% 0%, var(--hero-3), transparent 70%), radial-gradient(400px 260px at 95% 100%, rgba(247, 147, 30, .18), transparent 70%);
      pointer-events: none
    }

    .reco-band .wrap {
      position: relative
    }

    .reco-band h1 {
      font-size: clamp(30px, 4vw, 46px);
      font-weight: 800;
      letter-spacing: -.03em;
      margin-top: 14px;
      max-width: 760px
    }

    .reco-band p {
      color: var(--hero-mute);
      font-size: 17px;
      margin-top: 10px;
      max-width: 620px
    }

    .progress {
      margin-top: 34px;
      max-width: 820px
    }

    .prog-bar {
      height: 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .12);
      overflow: hidden
    }

    .prog-bar i {
      display: block;
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width .4s ease
    }

    .prog-steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      margin-top: 12px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--hero-mute)
    }

    .prog-steps span {
      display: flex;
      align-items: center;
      gap: 7px
    }

    .prog-steps span.on {
      color: var(--hero-ink)
    }

    .prog-steps span.done {
      color: var(--accent)
    }

    .prog-steps em {
      font-style: normal;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid currentColor;
      display: grid;
      place-items: center;
      font-size: 11.5px;
      flex: none
    }

    .reco-card {
      margin-top: -84px;
      position: relative;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: var(--shadow-lg);
      padding: 36px
    }

    .reco-q {
      font-size: 24px;
      font-weight: 800
    }

    .reco-qs {
      color: var(--ink-2);
      margin-top: 6px
    }

    .opts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 24px
    }

    .opt {
      border: 2px solid var(--line);
      background: var(--surface);
      border-radius: 18px;
      padding: 18px;
      text-align: left;
      cursor: pointer;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      position: relative;
      transition: border-color .15s, background .15s
    }

    .opt:hover {
      border-color: var(--link)
    }

    .opt.on {
      border-color: var(--accent);
      background: var(--accent-soft)
    }

    .opt .oi {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--navy-soft);
      color: var(--link);
      display: grid;
      place-items: center;
      flex: none
    }

    .opt.on .oi {
      background: var(--accent);
      color: var(--accent-ink)
    }

    .opt b {
      display: block;
      font-size: 16px;
      font-weight: 800
    }

    .opt small {
      display: block;
      color: var(--ink-2);
      font-size: 13.5px;
      margin-top: 3px
    }

    .opt .chk-dot {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-ink);
      display: none;
      place-items: center
    }

    .opt.on .chk-dot {
      display: grid
    }

    .opt .chk-dot .ic {
      width: 14px;
      height: 14px;
      stroke-width: 3
    }

    .lvl-bars {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 22px
    }

    .lvl-bars i {
      width: 6px;
      border-radius: 2px;
      background: currentColor;
      opacity: .25
    }

    .lvl-bars i.f {
      opacity: 1
    }

    .reco-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 30px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      gap: 12px
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .chip {
      border: 1.5px solid var(--line);
      background: var(--surface);
      border-radius: 99px;
      padding: 8px 16px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      color: var(--ink)
    }

    .chip:hover {
      border-color: var(--link)
    }

    .chip.on {
      background: var(--navy);
      border-color: var(--navy);
      color: var(--navy-ink)
    }

    .budget-big {
      font: 800 clamp(34px, 5vw, 48px) var(--f-display);
      letter-spacing: -.03em;
      font-variant-numeric: tabular-nums
    }

    .b3 {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 36px;
      margin-top: 24px
    }

    .b3 h4 {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 12px
    }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 60px 0;
      text-align: center
    }

    .spinner {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 4px solid var(--navy-soft);
      border-top-color: var(--accent);
      animation: spin .8s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .answers {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    .answers .pill {
      font-size: 13px;
      padding: 6px 12px
    }

    .tiers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 28px;
      align-items: start
    }

    .tier {
      border: 1.5px solid var(--line);
      border-radius: 22px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--surface);
      position: relative
    }

    .tier.best {
      border: 2.5px solid var(--accent);
      box-shadow: var(--shadow-lg);
      transform: translateY(-10px)
    }

    .best-badge {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: var(--accent-ink);
      font: 800 12.5px var(--f-body);
      padding: 6px 14px;
      border-radius: 99px;
      white-space: nowrap;
      display: flex;
      gap: 6px;
      align-items: center
    }

    .best-badge .ic {
      width: 15px;
      height: 15px
    }

    .tier-label {
      font: 800 12px var(--f-body);
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ink-3)
    }

    .tier.best .tier-label {
      color: var(--accent-text)
    }

    .tier h3 {
      font-size: 22px;
      font-weight: 800;
      margin-top: 4px
    }

    .tier-items {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .tier-items li {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 14px
    }

    .tier-items .art.thumb {
      width: 48px;
      height: 40px;
      border-radius: 10px
    }

    .tier-items div {
      flex: 1;
      min-width: 0
    }

    .tier-items b {
      display: block;
      font-weight: 700;
      line-height: 1.3
    }

    .tier-items small {
      color: var(--ink-3)
    }

    .tier-price {
      padding: 14px 0;
      border-block: 1px dashed var(--line)
    }

    .tier-price strong {
      display: block;
      font: 800 28px var(--f-display);
      letter-spacing: -.03em
    }

    .tier-price small {
      color: var(--ink-3);
      font-size: 13px
    }

    .meter {
      height: 7px;
      border-radius: 99px;
      background: var(--surface-2);
      overflow: hidden;
      margin-top: 10px
    }

    .meter i {
      display: block;
      height: 100%;
      border-radius: 99px;
      background: var(--ok)
    }

    .meter.over i {
      background: var(--warn)
    }

    .fit {
      font-size: 13px;
      font-weight: 700;
      margin-top: 6px
    }

    .fit.ok {
      color: var(--ok)
    }

    .fit.over {
      color: var(--warn)
    }

    .why {
      font-size: 14px;
      color: var(--ink-2);
      background: var(--surface-2);
      padding: 14px;
      border-radius: 14px
    }

    .why b {
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px
    }

    .why b .ic {
      width: 16px;
      height: 16px;
      color: var(--accent-text)
    }

    .tier-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto
    }

    /* Cart / checkout */
    .line {
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 18px 0;
      border-bottom: 1px solid var(--line)
    }

    .line:last-child {
      border-bottom: 0
    }

    .line .art.thumb {
      width: 88px;
      height: 70px
    }

    .line-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .line-main b {
      font-size: 16px
    }

    .line-main small {
      color: var(--ink-3)
    }

    .line-right {
      display: flex;
      align-items: center;
      gap: 16px
    }

    .line-sub {
      min-width: 110px;
      text-align: right;
      font-weight: 800
    }

    .ck-steps {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 22px;
      flex-wrap: wrap;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink-3)
    }

    .ck-steps span {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .ck-steps em {
      font-style: normal;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--surface-2);
      font-size: 12px
    }

    .ck-steps .done {
      color: var(--ok)
    }

    .ck-steps .done em {
      background: var(--ok-soft)
    }

    .ck-steps .on {
      color: var(--ink)
    }

    .ck-steps .on em {
      background: var(--navy);
      color: var(--navy-ink)
    }

    .ck-steps .sep {
      width: 28px;
      height: 2px;
      background: var(--line)
    }

    .store-box {
      display: flex;
      gap: 14px;
      padding: 16px;
      border-radius: 14px;
      border: 2px solid var(--navy);
      background: var(--navy-soft)
    }

    .store-box .ic {
      color: var(--link);
      margin-top: 2px
    }

    .radio-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .radio-card {
      flex: 1;
      min-width: 180px;
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      cursor: pointer;
      background: var(--surface);
      text-align: left
    }

    .radio-card.on {
      border-color: var(--navy);
      background: var(--navy-soft)
    }

    .radio-card:disabled {
      opacity: .5;
      cursor: not-allowed
    }

    .radio-card .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--ink-3);
      flex: none;
      margin-top: 2px;
      display: grid;
      place-items: center
    }

    .radio-card.on .dot {
      border-color: var(--link)
    }

    .radio-card.on .dot::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--link)
    }

    .radio-card b {
      display: block
    }

    .radio-card small {
      color: var(--ink-2)
    }

    .pm-group h4 {
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin: 18px 0 10px;
      font-weight: 800
    }

    .pm-group h4:first-child {
      margin-top: 0
    }

    .pm-opts {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px
    }

    .pm {
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      text-align: left
    }

    .pm:hover {
      border-color: var(--link)
    }

    .pm.on {
      border-color: var(--accent);
      background: var(--accent-soft)
    }

    .pm .logo-sq {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font: 800 11px var(--f-body);
      color: var(--navy-ink);
      background: var(--navy);
      flex: none
    }

    .pay-box {
      display: flex;
      gap: 28px;
      align-items: center;
      flex-wrap: wrap
    }

    .qr {
      width: 200px;
      height: 200px;
      max-width: 100%;
      color: var(--qr-ink);
      border-radius: 14px;
      box-shadow: var(--shadow);
      background: var(--qr-bg)
    }

    .qr .qf {
      fill: var(--qr-ink)
    }

    .qr .qb {
      fill: var(--qr-bg)
    }

    .va {
      font: 700 24px var(--f-mono);
      letter-spacing: .06em
    }

    .ol {
      padding-left: 20px;
      margin: 10px 0 0;
      color: var(--ink-2);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px
    }

    .cd-pay {
      font: 700 15px var(--f-mono);
      color: var(--warn)
    }

    .success {
      max-width: 760px;
      margin: 20px auto 0;
      text-align: center
    }

    .success .ok-ic {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: var(--ok-soft);
      color: var(--ok);
      display: grid;
      place-items: center;
      margin: 0 auto 18px
    }

    .success .ok-ic .ic {
      width: 38px;
      height: 38px;
      stroke-width: 2.6
    }

    .ticket {
      margin-top: 28px;
      display: grid;
      grid-template-columns: auto 1fr;
      text-align: left;
      overflow: hidden
    }

    .ticket-qr {
      padding: 28px;
      background: var(--surface-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      border-right: 2px dashed var(--line)
    }

    .ticket-info {
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0
    }

    .code {
      font: 700 28px var(--f-mono);
      letter-spacing: .08em;
      color: var(--ink)
    }

    .kv {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 18px;
      font-size: 14.5px
    }

    .kv dt {
      color: var(--ink-2)
    }

    .kv dd {
      margin: 0;
      font-weight: 700
    }

    /* Orders */
    .tabs {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--line);
      margin-top: 24px
    }

    .tabs button {
      background: none;
      border: 0;
      padding: 12px 16px;
      font-weight: 700;
      color: var(--ink-2);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -1px;
      display: flex;
      gap: 8px;
      align-items: center
    }

    .tabs button.on {
      color: var(--ink);
      border-color: var(--accent)
    }

    .tabs button em {
      font-style: normal;
      background: var(--surface-2);
      border-radius: 99px;
      padding: 1px 8px;
      font-size: 12px
    }

    .ocard {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      padding: 20px 22px;
      align-items: center
    }

    .ocard+.ocard {
      margin-top: 14px
    }

    .ocard-top {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap
    }

    .ocard-arts {
      display: flex;
      margin-top: 12px
    }

    .ocard-arts .art.mini+.art.mini {
      margin-left: -10px
    }

    .ocard-meta {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 12px;
      font-size: 14px;
      color: var(--ink-2)
    }

    .ocard-meta span {
      display: flex;
      gap: 6px;
      align-items: center
    }

    .ocard-meta .ic {
      width: 16px;
      height: 16px
    }

    .ocard-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px
    }

    .alert {
      display: flex;
      gap: 14px;
      padding: 16px 18px;
      border-radius: 16px;
      align-items: flex-start
    }

    .alert .ic {
      width: 22px;
      height: 22px;
      margin-top: 1px
    }

    .alert b {
      display: block;
      font-size: 15.5px
    }

    .alert.warn {
      background: var(--warn-soft);
      color: var(--warn)
    }

    .alert.bad {
      background: var(--bad-soft);
      color: var(--bad)
    }

    .alert.info {
      background: var(--navy-soft);
      color: var(--link)
    }

    .alert p {
      color: var(--ink-2);
      font-size: 14px;
      margin-top: 2px
    }

    .tl {
      list-style: none;
      margin: 0;
      padding: 0
    }

    .tl li {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 14px;
      position: relative;
      padding-bottom: 22px
    }

    .tl li:last-child {
      padding-bottom: 0
    }

    .tl li::before {
      content: "";
      position: absolute;
      left: 16px;
      top: 34px;
      bottom: 0;
      width: 2px;
      background: var(--line)
    }

    .tl li:last-child::before {
      display: none
    }

    .tl li.done::before {
      background: var(--ok)
    }

    .tl .mk {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--surface-2);
      color: var(--ink-3);
      border: 2px solid var(--line);
      z-index: 1
    }

    .tl .mk .ic {
      width: 16px;
      height: 16px;
      stroke-width: 2.4
    }

    .tl li.done .mk {
      background: var(--ok);
      border-color: var(--ok);
      color: var(--surface)
    }

    .tl li.cur .mk {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      box-shadow: 0 0 0 6px var(--accent-soft)
    }

    .tl-body {
      padding-top: 5px;
      min-width: 0
    }

    .tl-body b {
      font-size: 15.5px
    }

    .tl li.todo .tl-body b {
      color: var(--ink-3)
    }

    .tl-body .t {
      font-size: 13px;
      color: var(--ink-3);
      margin-left: 8px;
      font-weight: 600
    }

    .tl-body p {
      font-size: 14px;
      color: var(--ink-2);
      margin-top: 3px
    }

    .rfid-box {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: var(--surface)
    }

    .rfid-head {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 14px;
      background: var(--ok-soft);
      color: var(--ok);
      font-size: 13px;
      font-weight: 700;
      flex-wrap: wrap
    }

    .rfid-head .ic {
      width: 16px;
      height: 16px
    }

    .rfid-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 14px;
      border-top: 1px solid var(--line);
      font-size: 13.5px
    }

    .rfid-row .mono {
      color: var(--ink-3);
      font-size: 12.5px
    }

    .countdown {
      font: 700 clamp(30px, 4vw, 40px) var(--f-mono);
      letter-spacing: .02em;
      font-variant-numeric: tabular-nums
    }

    .cd-card {
      background: var(--navy);
      color: var(--navy-ink);
      border-radius: var(--r-lg);
      padding: 22px
    }

    .cd-card small {
      opacity: .75
    }

    .cd-card .lbl {
      font: 700 11.5px var(--f-mono);
      letter-spacing: .1em;
      opacity: .7;
      margin-top: 2px
    }

    .demo {
      border: 2px dashed var(--line);
      border-radius: var(--r-lg);
      padding: 18px;
      background: var(--bg)
    }

    .demo h4 {
      font-size: 14px;
      display: flex;
      gap: 8px;
      align-items: center
    }

    .demo p {
      font-size: 13px;
      color: var(--ink-2);
      margin: 6px 0 12px
    }

    .stars-in {
      display: flex;
      gap: 4px
    }

    .stars-in button {
      background: none;
      border: 0;
      padding: 2px;
      cursor: pointer;
      color: var(--ink-3)
    }

    .stars-in button .ic {
      width: 30px;
      height: 30px
    }

    .stars-in button.on .ic {
      fill: var(--accent);
      stroke: var(--accent)
    }

    .log-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px
    }

    .log-table th {
      text-align: left;
      font-size: 12px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--ink-3);
      padding: 8px 10px;
      border-bottom: 1px solid var(--line)
    }

    .log-table td {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: top
    }

    .tbl-wrap {
      overflow-x: auto
    }

    /* Auth */
    .auth {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: calc(100vh - 71px)
    }

    .auth-side {
      background: var(--hero);
      color: var(--hero-ink);
      padding: 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 24px;
      position: relative;
      overflow: hidden
    }

    .auth-side::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(420px 300px at 90% 10%, var(--hero-3), transparent 70%);
      pointer-events: none
    }

    .auth-side>* {
      position: relative
    }

    .auth-side h2 {
      font-size: clamp(28px, 3vw, 40px);
      font-weight: 800;
      letter-spacing: -.03em;
      max-width: 460px
    }

    .auth-side ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 440px
    }

    .auth-side li {
      display: flex;
      gap: 14px;
      color: var(--hero-mute)
    }

    .auth-side li b {
      display: block;
      color: var(--hero-ink)
    }

    .auth-side li .ic {
      color: var(--accent);
      margin-top: 2px
    }

    .auth-main {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px
    }

    .auth-card {
      width: 100%;
      max-width: 460px
    }

    .seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface-2);
      padding: 5px;
      border-radius: 14px;
      margin: 22px 0
    }

    .seg button {
      border: 0;
      background: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      color: var(--ink-2)
    }

    .seg button.on {
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow)
    }

    .drop {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 26px;
      border: 2px dashed var(--line);
      border-radius: 16px;
      cursor: pointer;
      text-align: center;
      background: var(--bg)
    }

    .drop:hover {
      border-color: var(--link)
    }

    .drop .ic {
      width: 28px;
      height: 28px;
      color: var(--link)
    }

    .drop small {
      color: var(--ink-3)
    }

    .drop.has {
      border-style: solid;
      border-color: var(--ok);
      background: var(--ok-soft)
    }

    .drop img {
      max-height: 120px;
      border-radius: 10px
    }

    .mini-steps {
      display: flex;
      gap: 6px;
      margin-bottom: 6px
    }

    .mini-steps i {
      flex: 1;
      height: 5px;
      border-radius: 9px;
      background: var(--line)
    }

    .mini-steps i.f {
      background: var(--accent)
    }

    .demo-hint {
      font-size: 13px;
      color: var(--ink-2);
      background: var(--surface-2);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      gap: 8px
    }

    .demo-hint .ic {
      width: 17px;
      height: 17px;
      color: var(--link);
      margin-top: 1px
    }

    /* Profile */
    .prof {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 28px;
      margin-top: 26px;
      align-items: start
    }

    .prof-nav {
      padding: 10px
    }

    .prof-nav button {
      display: flex;
      gap: 12px;
      align-items: center;
      width: 100%;
      padding: 12px 14px;
      border: 0;
      background: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      color: var(--ink-2);
      text-align: left
    }

    .prof-nav button:hover {
      background: var(--surface-2)
    }

    .prof-nav button.on {
      background: var(--navy-soft);
      color: var(--link)
    }

    .prof-id {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 14px 14px 18px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 8px
    }

    .prof-id .avatar {
      width: 48px;
      height: 48px;
      font-size: 17px
    }

    .prof-id div {
      min-width: 0
    }

    .prof-id small {
      color: var(--ink-3);
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .verif-card {
      display: flex;
      gap: 18px;
      align-items: center;
      padding: 20px;
      border-radius: 16px;
      background: var(--ok-soft)
    }

    .verif-card.pend {
      background: var(--warn-soft)
    }

    .verif-card.none {
      background: var(--bad-soft)
    }

    .verif-card .vi {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: var(--surface);
      display: grid;
      place-items: center;
      color: var(--ok);
      flex: none
    }

    .verif-card.pend .vi {
      color: var(--warn)
    }

    .verif-card.none .vi {
      color: var(--bad)
    }

    .pm-saved {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line)
    }

    .pm-saved:last-child {
      border-bottom: 0
    }

    .pm-saved div {
      flex: 1;
      min-width: 0
    }

    .pm-saved small {
      color: var(--ink-3)
    }

    .terms {
      counter-reset: t;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 0;
      padding: 0;
      list-style: none
    }

    .terms li {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 12px
    }

    .terms li::before {
      counter-increment: t;
      content: counter(t);
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--navy-soft);
      color: var(--link);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 13px
    }

    .terms b {
      display: block;
      margin-bottom: 2px
    }

    .terms p {
      color: var(--ink-2);
      font-size: 14.5px
    }

    /* How it works page */
    .how-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px
    }

    .how-card {
      padding: 28px;
      display: flex;
      gap: 20px
    }

    .how-card .hn {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: var(--navy);
      color: var(--navy-ink);
      display: grid;
      place-items: center;
      flex: none;
      font: 800 20px var(--f-display)
    }

    .how-card.rf .hn {
      background: var(--accent);
      color: var(--accent-ink)
    }

    .how-card h3 {
      font-size: 20px;
      margin-bottom: 6px
    }

    .how-card ul {
      margin: 10px 0 0;
      padding-left: 18px;
      color: var(--ink-2);
      font-size: 14.5px;
      display: flex;
      flex-direction: column;
      gap: 5px
    }

    .rfid-demo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center
    }

    .fee-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14.5px
    }

    .fee-table td {
      padding: 12px 0;
      border-bottom: 1px solid var(--line)
    }

    .fee-table td:last-child {
      text-align: right;
      font-weight: 700
    }

    /* Customize */
    .cz-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      gap: 14px;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--line)
    }

    .cz-row .art.thumb {
      width: 72px;
      height: 58px
    }

    .cz-row select {
      max-width: 100%
    }

    .cz-add {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px
    }

    .cz-add button {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 10px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      cursor: pointer;
      text-align: left
    }

    .cz-add button:hover {
      border-color: var(--link)
    }

    .cz-add div {
      flex: 1;
      min-width: 0
    }

    .cz-add b {
      display: block;
      font-size: 14px;
      line-height: 1.3
    }

    .cz-add small {
      color: var(--ink-3)
    }

    .cz-add .plus {
      color: var(--accent-text)
    }

    /* Modal & toast */
    .modal-back {
      position: fixed;
      inset: 0;
      background: rgba(5, 10, 25, .55);
      display: grid;
      place-items: center;
      z-index: 100;
      padding: 20px
    }

    .modal {
      background: var(--surface);
      border-radius: 24px;
      padding: 30px;
      width: 100%;
      max-width: 460px;
      box-shadow: var(--shadow-lg);
      text-align: center
    }

    .scan-ring {
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent-text);
      display: grid;
      place-items: center;
      position: relative
    }

    .scan-ring .ic {
      width: 42px;
      height: 42px
    }

    .scan-ring::before,
    .scan-ring::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid var(--accent);
      animation: pulse 1.6s ease-out infinite
    }

    .scan-ring::after {
      animation-delay: .8s
    }

    .scan-ring.done {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .scan-ring.done::before,
    .scan-ring.done::after {
      display: none
    }

    @keyframes pulse {
      from {
        transform: scale(1);
        opacity: .8
      }

      to {
        transform: scale(1.6);
        opacity: 0
      }
    }

    .scan-list {
      list-style: none;
      padding: 0;
      margin: 18px 0;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 40px
    }

    .scan-list li {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--ok-soft);
      font-size: 14px;
      animation: slidein .3s ease
    }

    .scan-list li .ic {
      color: var(--ok);
      width: 18px;
      height: 18px
    }

    .scan-list li div {
      flex: 1;
      min-width: 0
    }

    .scan-list li small {
      display: block;
      font: 500 12px var(--f-mono);
      color: var(--ink-3)
    }

    @keyframes slidein {
      from {
        opacity: .2;
        transform: translateY(6px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .toasts {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 120;
      width: min(440px, calc(100vw - 32px))
    }

    .toast {
      background: var(--ink);
      color: var(--bg);
      padding: 14px 16px;
      border-radius: 14px;
      box-shadow: var(--shadow-lg);
      display: flex;
      gap: 12px;
      align-items: center;
      font-weight: 600;
      font-size: 14.5px;
      animation: slidein .25s ease
    }

    .toast .ic {
      color: var(--accent)
    }

    .toast button {
      margin-left: auto;
      background: none;
      border: 0;
      color: var(--accent);
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important
      }

      html {
        scroll-behavior: auto
      }
    }

    /* Responsive */
    @media (max-width:1080px) {
      .menu button {
        padding: 9px 8px;
        font-size: 14px
      }

      .avatar-btn .nm {
        display: none
      }

      .fc-1 {
        left: -10px
      }

      .fc-2 {
        right: -10px
      }
    }

    @media (max-width:920px) {
      .menu {
        display: none
      }

      .hamb {
        display: inline-grid
      }

      .mnav.open {
        display: flex;
        flex-direction: column;
        padding: 8px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px));
        border-top: 1px solid var(--line)
      }

      .mnav button {
        background: none;
        border: 0;
        text-align: left;
        padding: 12px 4px;
        font-weight: 700;
        font-size: 16px;
        border-bottom: 1px solid var(--line);
        cursor: pointer
      }

      .hero-in {
        grid-template-columns: 1fr;
        padding-block: 48px 56px
      }

      .hero-visual {
        max-width: 460px;
        width: 100%;
        margin: 0 auto
      }

      .cats {
        grid-template-columns: repeat(3, 1fr)
      }
